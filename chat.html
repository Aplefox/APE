<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APE · 聊天</title>
<link rel="icon" type="image/png" href="https://s3.bmp.ovh/2026/09/02/yCkTXnjy.png">
<link rel="preconnect" href="https://fonts.font.im">
<link href="https://fonts.font.im/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
        --primary: #888;
        --bg: #0a0a0f;
        --panel: #131318;
        --panel-2: #1a1a20;
        --text: #f0f0f5;
        --text-secondary: rgba(255,255,255,0.6);
        --text-tertiary: rgba(255,255,255,0.3);
        --border: rgba(255,255,255,0.08);
        --card-bg: rgba(255,255,255,0.04);
        --card-hover: rgba(255,255,255,0.07);
        --msg-self: rgba(136,136,136,0.25);
        --msg-other: rgba(255,255,255,0.06);
        --online: #69db7c;
        --offline: rgba(255,255,255,0.2);
    }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* 布局 */
    .app {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    /* 左侧栏 */
    .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
    }
    .sidebar .sidebar-header {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .sidebar .sidebar-header .avatar {
        width: 36px; height: 36px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        overflow: hidden;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 500;
        color: var(--text-secondary);
    }
    .sidebar .sidebar-header .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .sidebar .sidebar-header .info { flex: 1; min-width: 0; }
    .sidebar .sidebar-header .name {
        font-size: 14px; font-weight: 500; color: #fff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar .sidebar-header .status {
        font-size: 11px; color: var(--online);
        display: flex; align-items: center; gap: 5px;
        margin-top: 2px;
    }
    .sidebar .sidebar-header .status::before {
        content: '';
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--online);
    }
    .sidebar .sidebar-header .back-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
    }
    .sidebar .sidebar-header .back-btn:hover { background: var(--card-hover); color: #fff; }

    /* 标签页导航 */
    .tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    .tabs .tab {
        flex: 1;
        padding: 12px 8px;
        text-align: center;
        font-size: 12px;
        color: var(--text-tertiary);
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        position: relative;
        font-family: 'Inter', sans-serif;
    }
    .tabs .tab:hover { color: var(--text-secondary); background: rgba(255,255,255,0.02); }
    .tabs .tab.active {
        color: #fff;
        background: rgba(255,255,255,0.03);
    }
    .tabs .tab.active::after {
        content: '';
        position: absolute;
        bottom: 0; left: 20%; right: 20%;
        height: 2px;
        background: var(--primary);
    }
    .tabs .tab .badge {
        display: inline-block;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: #e74c3c;
        color: #fff;
        font-size: 10px;
        line-height: 16px;
        margin-left: 4px;
        font-weight: 500;
        vertical-align: middle;
    }

    /* 列表 */
    .list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
    }
    .list-item {
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
    }
    .list-item:hover { background: var(--card-hover); }
    .list-item.active { background: var(--card-hover); }
    .list-item .avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        overflow: hidden;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; font-weight: 500;
        color: var(--text-secondary);
        position: relative;
    }
    .list-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .list-item .avatar .dot {
        position: absolute;
        bottom: 0; right: 0;
        width: 10px; height: 10px;
        border-radius: 50%;
        border: 2px solid var(--panel);
        background: var(--offline);
    }
    .list-item .avatar .dot.online { background: var(--online); }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .name {
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .list-item .preview {
        font-size: 12px;
        color: var(--text-tertiary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 3px;
    }
    .list-item .meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        flex-shrink: 0;
    }
    .list-item .meta .time { font-size: 11px; color: var(--text-tertiary); }
    .list-item .meta .unread {
        min-width: 18px; height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: #e74c3c;
        color: #fff;
        font-size: 10px;
        line-height: 18px;
        text-align: center;
        font-weight: 500;
    }

    .list-empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--text-tertiary);
        font-size: 13px;
    }

    /* 主区 */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        min-width: 0;
    }
    .chat-header {
        padding: 14px 22px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
        flex-shrink: 0;
    }
    .chat-header .back-mobile {
        display: none;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px 0 0;
        line-height: 1;
    }
    .chat-header .title {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .chat-header .subtitle {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 2px;
    }
    .chat-header .subtitle .online-count {
        color: var(--online);
    }

    /* 消息区 */
    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .messages-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-tertiary);
        font-size: 14px;
        letter-spacing: 2px;
    }
    .msg {
        display: flex;
        gap: 10px;
        max-width: 70%;
        align-items: flex-start;
    }
    .msg.self {
        align-self: flex-end;
        flex-direction: row-reverse;
    }
    .msg .msg-avatar {
        width: 34px; height: 34px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        overflow: hidden;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 500;
        color: var(--text-secondary);
    }
    .msg .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg .msg-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
    }
    .msg .msg-name {
        font-size: 11px;
        color: var(--text-tertiary);
        padding: 0 4px;
    }
    .msg.self .msg-name { text-align: right; }
    .msg .msg-content {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        word-break: break-word;
        white-space: pre-wrap;
    }
    .msg.other .msg-content {
        background: var(--msg-other);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
    }
    .msg.self .msg-content {
        background: var(--msg-self);
        border: 1px solid rgba(136,136,136,0.3);
        border-top-right-radius: 4px;
    }
    .msg .msg-time {
        font-size: 10px;
        color: var(--text-tertiary);
        padding: 0 4px;
    }
    .msg.self .msg-time { text-align: right; }

    /* 通知样式 */
    .msg.notification {
        align-self: center;
        max-width: 90%;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 20px;
        flex-direction: column;
        gap: 6px;
        text-align: center;
    }
    .msg.notification .notif-title {
        font-size: 13px;
        font-weight: 600;
        color: #fff;
    }
    .msg.notification .notif-content {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.6;
    }
    .msg.notification .notif-time {
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 4px;
    }

    /* 输入区 */
    .composer {
        padding: 14px 22px 18px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-shrink: 0;
    }
    .composer textarea {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 16px;
        color: var(--text);
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        outline: none;
        resize: none;
        min-height: 44px;
        max-height: 120px;
        line-height: 1.5;
        transition: border-color 0.15s;
    }
    .composer textarea:focus { border-color: rgba(255,255,255,0.2); }
    .composer button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 0 22px;
        height: 44px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: background 0.15s, transform 0.1s;
        flex-shrink: 0;
    }
    .composer button:hover { background: #999; }
    .composer button:active { transform: scale(0.97); }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .composer .disabled-hint {
        flex: 1;
        text-align: center;
        font-size: 13px;
        color: var(--text-tertiary);
        padding: 12px;
        background: var(--card-bg);
        border-radius: 12px;
        border: 1px solid var(--border);
    }

    /* 空状态 */
    .empty-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-tertiary);
        gap: 12px;
    }
    .empty-main .icon { font-size: 56px; opacity: 0.4; }
    .empty-main .text { font-size: 14px; letter-spacing: 2px; }

    /* 移动端 */
    @media (max-width: 768px) {
        .sidebar {
            width: 100%;
            position: absolute;
            top: 0; left: 0; bottom: 0;
            z-index: 10;
            transition: transform 0.25s ease;
        }
        .sidebar.hidden { transform: translateX(-100%); }
        .main { width: 100%; }
        .chat-header .back-mobile { display: block; }
        .msg { max-width: 85%; }
        .composer { padding: 10px 14px 14px; }
        .messages { padding: 16px 14px; }
    }

    /* Toast */
    #toast-container {
        position: fixed; bottom: 80px; left: 50%;
        transform: translateX(-50%);
        z-index: 99999; pointer-events: none;
        display: flex; flex-direction: column;
        align-items: center; gap: 8px;
    }
    .toast-item {
        padding: 10px 24px;
        border-radius: 8px;
        background: rgba(0,0,0,0.9);
        border: 1px solid rgba(255,255,255,0.1);
        color: #fff; font-size: 13px;
        animation: toastIn 0.2s ease;
    }
    .toast-item.error { border-color: rgba(231,76,60,0.4); }
    .toast-item.success { border-color: rgba(76,175,80,0.4); }
    @keyframes toastIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="app">

    <!-- 左侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="avatar" id="my-avatar">
                <span id="my-avatar-text">👤</span>
                <img id="my-avatar-img" style="display:none;" alt="">
            </div>
            <div class="info">
                <div class="name" id="my-name">未登录</div>
                <div class="status" id="my-status">在线</div>
            </div>
            <button class="back-btn" onclick="goBack()">← 返回</button>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="group" onclick="switchTab('group')">
                <span>群聊</span>
            </div>
            <div class="tab" data-tab="private" onclick="switchTab('private')">
                <span>私信</span>
                <span class="badge" id="badge-private" style="display:none;">0</span>
            </div>
            <div class="tab" data-tab="notif" onclick="switchTab('notif')">
                <span>通知</span>
                <span class="badge" id="badge-notif" style="display:none;">0</span>
            </div>
        </div>

        <div class="list" id="list"></div>
    </aside>

    <!-- 主区 -->
    <main class="main" id="main">
        <div class="chat-header" id="chat-header" style="display:none;">
            <button class="back-mobile" onclick="showSidebar()">‹</button>
            <div style="flex:1;min-width:0;">
                <div class="title" id="chat-title"></div>
                <div class="subtitle" id="chat-subtitle"></div>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="empty-main">
                <div class="icon">💬</div>
                <div class="text">选择左侧开始聊天</div>
            </div>
        </div>

        <div class="composer" id="composer" style="display:none;">
            <textarea id="composer-input" placeholder="输入消息..." rows="1" maxlength="1000"></textarea>
            <button id="composer-send" onclick="sendMessage()">发送</button>
        </div>
    </main>

</div>

<script>
let SB = null;

async function initSB() {
    const res = await fetch('key.json');
    const cfg = await res.json();
    SB = supabase.createClient(cfg.supabase_url, cfg.supabase_key);
}

const state = {
    user: localStorage.getItem('ape_user') || null,
    avatar: localStorage.getItem('ape_avatar') || null,
    role: localStorage.getItem('ape_role') || 'user',
    currentTab: 'group',
    currentChat: null,
    // currentChat 结构：
    // { type: 'group' }
    // { type: 'private', username: 'xxx' }
    users: [],
    userMap: {},
    heartbeatTimer: null,
    realtimeChannel: null,
    unreadPrivate: 0,
    unreadNotif: 0
};

const ADMIN_USER = 'Aplefox';

function showToast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast-item ' + type;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
        el.style.animation = 'toastOut 0.2s ease forwards';
        setTimeout(() => el.remove(), 200);
    }, 2000);
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) {
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }
    const m = (d.getMonth() + 1).toString().padStart(2, '0');
    const day = d.getDate().toString().padStart(2, '0');
    return m + '/' + day;
}

function formatFullTime(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' +
        (d.getMonth() + 1).toString().padStart(2, '0') + '-' +
        d.getDate().toString().padStart(2, '0') + ' ' +
        d.getHours().toString().padStart(2, '0') + ':' +
        d.getMinutes().toString().padStart(2, '0');
}

/* ===== 初始化 ===== */
async function boot() {
    await initSB();

    if (!state.user) {
        document.getElementById('my-name').textContent = '未登录';
        document.getElementById('my-status').textContent = '请先登录';
        document.getElementById('my-status').style.color = 'var(--text-tertiary)';
        showToast('请先在主页登录', 'error');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        return;
    }

    document.getElementById('my-name').textContent = state.user;
    if (state.avatar) {
        const img = document.getElementById('my-avatar-img');
        img.src = state.avatar;
        img.style.display = 'block';
        document.getElementById('my-avatar-text').style.display = 'none';
    } else {
        document.getElementById('my-avatar-text').textContent = state.user.charAt(0).toUpperCase();
    }

    // 登录通知
    await notifyLogin();

    // 加载用户列表
    await loadUsers();

    // 心跳
    startHeartbeat();

    // 初始化 Realtime
    initRealtime();

    // 默认打开群聊
    openGroup();
}

async function notifyLogin() {
    const ua = navigator.userAgent;
    let device = '未知设备';
    if (ua.includes('iPhone')) device = 'iPhone';
    else if (ua.includes('Android')) device = 'Android';
    else if (ua.includes('Macintosh')) device = 'Mac';
    else if (ua.includes('Windows')) device = 'Windows';
    else if (ua.includes('Linux')) device = 'Linux';
    try {
        await SB.rpc('chat_notify_login', { p_username: state.user, p_device: device });
    } catch (e) {
        console.warn('登录通知发送失败', e);
    }
}

/* ===== 心跳 ===== */
function startHeartbeat() {
    const beat = async () => {
        try {
            await SB.rpc('chat_heartbeat', { p_username: state.user });
        } catch (e) {}
    };
    beat();
    state.heartbeatTimer = setInterval(beat, 30000);
}

/* ===== 加载用户 ===== */
async function loadUsers() {
    try {
        const { data, error } = await SB.rpc('chat_user_list');
        if (error) throw error;
        state.users = data || [];
        state.userMap = {};
        state.users.forEach(u => { state.userMap[u.username] = u; });
    } catch (e) {
        console.warn('加载用户失败', e);
        state.users = [];
    }
}

/* ===== 标签切换 ===== */
function switchTab(tab) {
    state.currentTab = tab;
    document.querySelectorAll('.tabs .tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
    });
    renderList();
}

/* ===== 渲染左侧列表 ===== */
function renderList() {
    const list = document.getElementById('list');

    if (state.currentTab === 'group') {
        const onlineCount = state.users.filter(u => u.is_online).length;
        list.innerHTML = `
            <div class="list-item ${state.currentChat && state.currentChat.type === 'group' ? 'active' : ''}"
                 onclick="openGroup()">
                <div class="avatar" style="background:rgba(136,136,136,0.15);border-color:rgba(136,136,136,0.3);">
                    <span style="font-size:18px;">👥</span>
                </div>
                <div class="info">
                    <div class="name">APE 交流群</div>
                    <div class="preview">${onlineCount} 人在线 · 点击进入</div>
                </div>
            </div>
        `;
        return;
    }

    if (state.currentTab === 'private') {
        // 排除自己
        const others = state.users.filter(u => u.username !== state.user);
        if (others.length === 0) {
            list.innerHTML = '<div class="list-empty">暂无其他用户</div>';
            return;
        }
        list.innerHTML = others.map(u => {
            const active = state.currentChat && state.currentChat.type === 'private' && state.currentChat.username === u.username;
            const onlineDot = u.is_online ? 'online' : '';
            const preview = u.is_online ? '在线' : '离线';
            const avatarContent = u.avatar_url
                ? `<img src="${u.avatar_url}" alt="">`
                : `<span>${u.username.charAt(0).toUpperCase()}</span>`;
            return `
                <div class="list-item ${active ? 'active' : ''}" onclick="openPrivate('${u.username}')">
                    <div class="avatar">
                        ${avatarContent}
                        <div class="dot ${onlineDot}"></div>
                    </div>
                    <div class="info">
                        <div class="name">${escapeHtml(u.username)}</div>
                        <div class="preview">${preview}</div>
                    </div>
                </div>
            `;
        }).join('');
        return;
    }

    if (state.currentTab === 'notif') {
        list.innerHTML = `
            <div class="list-item ${state.currentChat && state.currentChat.type === 'notif' ? 'active' : ''}"
                 onclick="openNotif()">
                <div class="avatar" style="background:rgba(255,193,7,0.12);border-color:rgba(255,193,7,0.3);">
                    <span style="font-size:18px;">🔔</span>
                </div>
                <div class="info">
                    <div class="name">系统通知</div>
                    <div class="preview">登录提醒 · 申请状态</div>
                </div>
            </div>
        `;
    }
}

/* ===== 打开群聊 ===== */
async function openGroup() {
    state.currentChat = { type: 'group' };
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('composer').style.display = 'flex';
    document.getElementById('chat-title').textContent = 'APE 交流群';
    const onlineCount = state.users.filter(u => u.is_online).length;
    document.getElementById('chat-subtitle').innerHTML =
        `所有注册用户 · <span class="online-count">${onlineCount}</span> 人在线`;
    renderList();
    await loadGroupMessages();
}

/* ===== 打开私信 ===== */
async function openPrivate(username) {
    state.currentChat = { type: 'private', username };
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('composer').style.display = 'flex';
    document.getElementById('chat-title').textContent = username;
    const u = state.userMap[username];
    const statusText = u && u.is_online ? '在线' : '离线';
    document.getElementById('chat-subtitle').textContent = statusText;
    renderList();
    await loadPrivateMessages(username);
    await markPrivateRead(username);
}

/* ===== 打开通知 ===== */
async function openNotif() {
    state.currentChat = { type: 'notif' };
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('composer').style.display = 'none';
    document.getElementById('chat-title').textContent = '系统通知';
    document.getElementById('chat-subtitle').textContent = '登录提醒 · 申请状态';
    renderList();
    await loadNotifications();
    await markNotifRead();
}

/* ===== 加载群聊消息 ===== */
async function loadGroupMessages() {
    const container = document.getElementById('messages');
    container.innerHTML = '<div class="messages-empty">加载中...</div>';
    try {
        const { data, error } = await SB.from('chat_messages')
            .select('*')
            .eq('is_deleted', false)
            .order('created_at', { ascending: true })
            .limit(200);
        if (error) throw error;
        renderGroupMessages(data || []);
    } catch (e) {
        container.innerHTML = '<div class="messages-empty">加载失败</div>';
    }
}

function renderGroupMessages(messages) {
    const container = document.getElementById('messages');
    if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="messages-empty">还没有消息，说点什么吧</div>';
        return;
    }
    container.innerHTML = messages.map(m => renderGroupMsg(m)).join('');
    scrollToBottom();
}

function renderGroupMsg(m) {
    const isSelf = m.username === state.user;
    const u = state.userMap[m.username];
    const avatarContent = u && u.avatar_url
        ? `<img src="${u.avatar_url}" alt="">`
        : `<span>${m.username.charAt(0).toUpperCase()}</span>`;
    return `
        <div class="msg ${isSelf ? 'self' : 'other'}">
            <div class="msg-avatar">${avatarContent}</div>
            <div class="msg-body">
                ${!isSelf ? `<div class="msg-name">${escapeHtml(m.username)}</div>` : ''}
                <div class="msg-content">${escapeHtml(m.content)}</div>
                <div class="msg-time">${formatTime(m.created_at)}</div>
            </div>
        </div>
    `;
}

/* ===== 加载私信 ===== */
async function loadPrivateMessages(otherUser) {
    const container = document.getElementById('messages');
    container.innerHTML = '<div class="messages-empty">加载中...</div>';
    try {
        const { data, error } = await SB.from('chat_private')
            .select('*')
            .or(`and(sender.eq.${state.user},receiver.eq.${otherUser}),and(sender.eq.${otherUser},receiver.eq.${state.user})`)
            .eq('is_deleted', false)
            .order('created_at', { ascending: true })
            .limit(200);
        if (error) throw error;
        renderPrivateMessages(data || []);
    } catch (e) {
        container.innerHTML = '<div class="messages-empty">加载失败</div>';
    }
}

function renderPrivateMessages(messages) {
    const container = document.getElementById('messages');
    if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="messages-empty">还没有消息</div>';
        return;
    }
    container.innerHTML = messages.map(m => renderPrivateMsg(m)).join('');
    scrollToBottom();
}

function renderPrivateMsg(m) {
    const isSelf = m.sender === state.user;
    const other = isSelf ? m.receiver : m.sender;
    const u = state.userMap[other];
    const avatarContent = u && u.avatar_url
        ? `<img src="${u.avatar_url}" alt="">`
        : `<span>${other.charAt(0).toUpperCase()}</span>`;
    return `
        <div class="msg ${isSelf ? 'self' : 'other'}">
            <div class="msg-avatar">${avatarContent}</div>
            <div class="msg-body">
                <div class="msg-content">${escapeHtml(m.content)}</div>
                <div class="msg-time">${formatTime(m.created_at)}</div>
            </div>
        </div>
    `;
}

/* ===== 加载通知 ===== */
async function loadNotifications() {
    const container = document.getElementById('messages');
    container.innerHTML = '<div class="messages-empty">加载中...</div>';
    try {
        const { data, error } = await SB.from('chat_notifications')
            .select('*')
            .eq('username', state.user)
            .eq('is_deleted', false)
            .order('created_at', { ascending: false })
            .limit(200);
        if (error) throw error;
        renderNotifications(data || []);
    } catch (e) {
        container.innerHTML = '<div class="messages-empty">加载失败</div>';
    }
}

function renderNotifications(items) {
    const container = document.getElementById('messages');
    if (!items || items.length === 0) {
        container.innerHTML = '<div class="messages-empty">暂无通知</div>';
        return;
    }
    container.innerHTML = items.map(n => `
        <div class="msg notification">
            <div class="notif-title">${escapeHtml(n.title)}</div>
            <div class="notif-content">${escapeHtml(n.content)}</div>
            <div class="notif-time">${formatFullTime(n.created_at)}</div>
        </div>
    `).join('');
}

/* ===== 发送消息 ===== */
async function sendMessage() {
    const input = document.getElementById('composer-input');
    const content = input.value.trim();
    if (!content) return;
    if (!state.currentChat) return;

    const btn = document.getElementById('composer-send');
    btn.disabled = true;

    try {
        if (state.currentChat.type === 'group') {
            const { error } = await SB.from('chat_messages').insert({
                username: state.user,
                content: content
            });
            if (error) throw error;
        } else if (state.currentChat.type === 'private') {
            const { error } = await SB.from('chat_private').insert({
                sender: state.user,
                receiver: state.currentChat.username,
                content: content
            });
            if (error) throw error;
        }
        input.value = '';
        input.style.height = 'auto';
        // Realtime 会推送回来，但为了保险本地也刷新一次
        if (state.currentChat.type === 'group') {
            await loadGroupMessages();
        } else if (state.currentChat.type === 'private') {
            await loadPrivateMessages(state.currentChat.username);
        }
    } catch (e) {
        showToast('发送失败: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

/* ===== 标记已读 ===== */
async function markPrivateRead(otherUser) {
    try {
        await SB.from('chat_private')
            .update({ is_read: true })
            .eq('sender', otherUser)
            .eq('receiver', state.user)
            .eq('is_read', false);
        updateUnreadCounts();
    } catch (e) {}
}

async function markNotifRead() {
    try {
        await SB.from('chat_notifications')
            .update({ is_read: true })
            .eq('username', state.user)
            .eq('is_read', false);
        updateUnreadCounts();
    } catch (e) {}
}

async function updateUnreadCounts() {
    try {
        const { count: privCount } = await SB.from('chat_private')
            .select('id', { count: 'exact', head: true })
            .eq('receiver', state.user)
            .eq('is_read', false)
            .eq('is_deleted', false);
        const { count: notifCount } = await SB.from('chat_notifications')
            .select('id', { count: 'exact', head: true })
            .eq('username', state.user)
            .eq('is_read', false)
            .eq('is_deleted', false);

        const privBadge = document.getElementById('badge-private');
        const notifBadge = document.getElementById('badge-notif');

        if (privCount > 0) {
            privBadge.style.display = 'inline-block';
            privBadge.textContent = privCount > 99 ? '99+' : privCount;
        } else {
            privBadge.style.display = 'none';
        }

        if (notifCount > 0) {
            notifBadge.style.display = 'inline-block';
            notifBadge.textContent = notifCount > 99 ? '99+' : notifCount;
        } else {
            notifBadge.style.display = 'none';
        }
    } catch (e) {}
}

/* ===== Realtime ===== */
function initRealtime() {
    state.realtimeChannel = SB.channel('chat_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
            if (state.currentChat && state.currentChat.type === 'group') {
                appendGroupMessage(payload.new);
            }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_private' }, payload => {
            const m = payload.new;
            // 只关心和我相关的
            if (m.sender !== state.user && m.receiver !== state.user) return;
            if (state.currentChat && state.currentChat.type === 'private') {
                // 当前正在和对方聊
                const other = state.currentChat.username;
                if ((m.sender === state.user && m.receiver === other) ||
                    (m.sender === other && m.receiver === state.user)) {
                    appendPrivateMessage(m);
                    if (m.receiver === state.user) {
                        markPrivateRead(other);
                    }
                    return;
                }
            }
            // 其他情况：更新未读
            if (m.receiver === state.user) {
                updateUnreadCounts();
            }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_notifications' }, payload => {
            const n = payload.new;
            if (n.username !== state.user) return;
            if (state.currentChat && state.currentChat.type === 'notif') {
                appendNotification(n);
                markNotifRead();
            } else {
                updateUnreadCounts();
            }
        })
        .subscribe();
}

function appendGroupMessage(m) {
    const container = document.getElementById('messages');
    const empty = container.querySelector('.messages-empty');
    if (empty) empty.remove();
    container.insertAdjacentHTML('beforeend', renderGroupMsg(m));
    scrollToBottom();
}

function appendPrivateMessage(m) {
    const container = document.getElementById('messages');
    const empty = container.querySelector('.messages-empty');
    if (empty) empty.remove();
    container.insertAdjacentHTML('beforeend', renderPrivateMsg(m));
    scrollToBottom();
}

function appendNotification(n) {
    const container = document.getElementById('messages');
    const empty = container.querySelector('.messages-empty');
    if (empty) empty.remove();
    const html = `
        <div class="msg notification">
            <div class="notif-title">${escapeHtml(n.title)}</div>
            <div class="notif-content">${escapeHtml(n.content)}</div>
            <div class="notif-time">${formatFullTime(n.created_at)}</div>
        </div>
    `;
    container.insertAdjacentHTML('afterbegin', html);
}

/* ===== 工具 ===== */
function scrollToBottom() {
    const container = document.getElementById('messages');
    requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
    });
}

function showSidebar() {
    document.getElementById('sidebar').classList.remove('hidden');
}

function goBack() {
    window.location.href = 'index.html';
}

/* ===== 输入框 ===== */
const composerInput = document.getElementById('composer-input');
composerInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
composerInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

/* ===== 移动端返回键处理 ===== */
window.addEventListener('popstate', function() {
    if (window.innerWidth <= 768) {
        if (!document.getElementById('sidebar').classList.contains('hidden')) {
            window.location.href = 'index.html';
        } else {
            showSidebar();
            history.pushState(null, '', '');
        }
    }
});
if (window.innerWidth <= 768) {
    history.pushState(null, '', '');
}

/* ===== 定时刷新在线状态和未读数 ===== */
setInterval(async () => {
    await loadUsers();
    renderList();
    // 更新群聊副标题在线人数
    if (state.currentChat && state.currentChat.type === 'group') {
        const onlineCount = state.users.filter(u => u.is_online).length;
        document.getElementById('chat-subtitle').innerHTML =
            `所有注册用户 · <span class="online-count">${onlineCount}</span> 人在线`;
    }
    // 更新私聊在线状态
    if (state.currentChat && state.currentChat.type === 'private') {
        const u = state.userMap[state.currentChat.username];
        document.getElementById('chat-subtitle').textContent = u && u.is_online ? '在线' : '离线';
    }
    updateUnreadCounts();
}, 30000);

/* ===== 启动 ===== */
boot();
updateUnreadCounts();

Object.assign(window, {
    switchTab, openGroup, openPrivate, openNotif, sendMessage, showSidebar, goBack
});

console.log('APE 聊天已加载');
</script>
