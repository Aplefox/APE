<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APE 论坛 & 聊天</title>
    <link rel="icon" type="image/png" href="https://bee-reg-ab.imagency.cn/p/52395a583541e8836c1e7f9b4332aba1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ===== 全局共享 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        :root {
            --primary:#d32f2f; --hover:#b71c1c; --shadow:rgba(211,47,47,0.3);
            --bg:#12121a; --text:#e0e0e0; --card:rgba(30,30,40,0.85);
            --border:rgba(255,255,255,0.06); --input:rgba(255,255,255,0.05);
            --nav-bg:rgba(10,10,10,0.75); --nav-border:rgba(255,255,255,0.06);
            --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
            --modal-bg:rgba(0,0,0,0.5);
            --btn-text:#fff;
            --btn-outline-text:#fff;
        }
        body {
            background:var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(211,47,47,0.06) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(211,47,47,0.04) 0%, transparent 50%);
            color:var(--text);
            font-family:'Inter',sans-serif; font-weight:400;
            min-height:100vh;
        }
        body.light-mode {
            --bg:#f0f0f5; --text:#1a1a2e; --card:rgba(255,255,255,0.9);
            --border:rgba(0,0,0,0.06); --input:rgba(0,0,0,0.03);
            --nav-bg:rgba(255,255,255,0.9); --nav-border:rgba(0,0,0,0.06);
            --modal-bg:rgba(0,0,0,0.15);
            --btn-text:#fff;
            --btn-outline-text:#1a1a2e;
        }
        body.light-mode .post-card .title { color:#1a1a2e; }
        body.light-mode .post-card .desc { color:rgba(0,0,0,0.6); }
        body.light-mode .post-card .meta { color:rgba(0,0,0,0.4); }
        body.light-mode .nav .logo { color:#1a1a2e; }
        body.light-mode .nav .right a { color:#555; }
        body.light-mode .nav .right a:hover { color:#1a1a2e; }
        body.light-mode .nav .right .user { color:#d32f2f; }
        body.light-mode .chapter-nav .ch-btn { color:rgba(0,0,0,0.6); border-color:rgba(0,0,0,0.1); }
        body.light-mode .chapter-nav .ch-btn.active { color:#fff; }
        body.light-mode .chapter-content .body { color:rgba(0,0,0,0.85); }
        body.light-mode .read-header h1 { color:#1a1a2e; }
        body.light-mode .read-header .meta { color:rgba(0,0,0,0.5); }
        body.light-mode .action-row .like-btn { color:rgba(0,0,0,0.6); }
        body.light-mode .action-row .like-btn:hover { color:#1a1a2e; }
        body.light-mode .comment-item .name { color:rgba(0,0,0,0.8); }
        body.light-mode .comment-item .text { color:rgba(0,0,0,0.7); }
        body.light-mode .form-group label { color:rgba(0,0,0,0.7); }
        body.light-mode .form-group input, body.light-mode .form-group textarea { color:#1a1a2e; }
        body.light-mode .modal .title { color:#1a1a2e; }
        body.light-mode .uc-panel .name { color:#1a1a2e; }
        body.light-mode .uc-panel .stats { color:rgba(0,0,0,0.6); }
        body.light-mode .uc-panel .stats .num { color:#1a1a2e; }
        body.light-mode .btn-outline { border-color:rgba(0,0,0,0.15); color:#1a1a2e; }
        body.light-mode .btn-outline:hover { background:rgba(0,0,0,0.05); }
        body.light-mode .empty-state { color:rgba(0,0,0,0.3); }

        /* ---- 动画 ---- */
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow:0 0 0 0 rgba(211,47,47,0.4); }
            70% { box-shadow:0 0 0 10px rgba(211,47,47,0); }
            100% { box-shadow:0 0 0 0 rgba(211,47,47,0); }
        }
        @keyframes likePop {
            0% { transform:scale(1); }
            25% { transform:scale(1.3); }
            50% { transform:scale(0.9); }
            100% { transform:scale(1); }
        }
        @keyframes slideIn {
            from { opacity:0; transform:translateX(10px); }
            to { opacity:1; transform:translateX(0); }
        }
        @keyframes modalIn {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes modalOut {
            from { opacity:1; transform:scale(1) translateY(0); }
            to { opacity:0; transform:scale(0.95) translateY(20px); }
        }
        body.performance-mode * {
            animation-duration: 0s !important;
            animation-delay: 0s !important;
            transition-duration: 0s !important;
            transition-delay: 0s !important;
        }

        .container {
            max-width:1200px; margin:0 auto; padding:80px 20px 40px;
            animation:fadeInUp 0.6s ease-out;
        }
        .nav {
            position:fixed; top:0; left:0; width:100%; height:60px;
            background:var(--nav-bg); backdrop-filter:blur(24px);
            border-bottom:1px solid var(--nav-border);
            display:flex; justify-content:space-between; align-items:center;
            padding:0 20px; z-index:1000;
        }
        .nav .logo { font-size:20px; font-weight:600; color:#fff; cursor:pointer; }
        .nav .right { display:flex; gap:15px; align-items:center; flex-wrap:wrap; }
        .nav .right a { color:#aaa; text-decoration:none; font-size:14px; cursor:pointer; }
        .nav .right a:hover { color:#fff; }
        .nav .right .user { color:var(--primary); font-weight:600; font-size:14px; cursor:pointer; }

        .theme-toggle {
            background:transparent; border:1px solid var(--nav-border);
            border-radius:50%; width:32px; height:32px;
            color:#aaa; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all 0.3s;
        }
        .theme-toggle:hover { color:#fff; border-color:rgba(255,255,255,0.3); }
        body.light-mode .theme-toggle { color:#555; border-color:rgba(0,0,0,0.1); }
        body.light-mode .theme-toggle:hover { color:#1a1a2e; border-color:rgba(0,0,0,0.3); }

        .perf-toggle {
            background:transparent; border:1px solid var(--nav-border);
            border-radius:50%; width:32px; height:32px;
            color:#aaa; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all 0.3s;
        }
        .perf-toggle:hover { color:#fff; border-color:rgba(255,255,255,0.3); }
        body.light-mode .perf-toggle { color:#555; border-color:rgba(0,0,0,0.1); }
        body.light-mode .perf-toggle:hover { color:#1a1a2e; border-color:rgba(0,0,0,0.3); }

        .btn {
            display:inline-block; background:var(--primary); color:#fff; border:none;
            padding:8px 20px; border-radius:var(--radius-sm); font-size:14px;
            font-weight:500; cursor:pointer; transition:.2s; text-decoration:none;
            animation:pulseGlow 2s infinite;
        }
        .btn:hover { background:var(--hover); transform:translateY(-1px); }
        .btn-outline {
            background:transparent; border:1px solid rgba(255,255,255,0.15); color:#fff;
            animation:none;
        }
        .btn-outline:hover { background:rgba(255,255,255,0.05); }
        .btn-sm { padding:5px 14px; font-size:12px; }
        .btn-danger { background:#e74c3c; animation:none; }
        .btn-danger:hover { background:#c0392b; }

        /* ===== 论坛卡片 ===== */
        .post-card {
            background:var(--card); backdrop-filter:blur(8px);
            border:1px solid var(--border);
            border-radius:var(--radius-md);
            padding:20px 24px; margin-bottom:15px; cursor:pointer;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
            transition:all 0.3s;
            animation:fadeInUp 0.5s ease-out;
        }
        .post-card:hover { transform:translateY(-4px) scale(1.01); border-color:rgba(211,47,47,0.3); box-shadow:0 8px 30px rgba(0,0,0,0.5); }
        .post-card .title { font-size:18px; font-weight:600; color:#fff; margin-bottom:4px; }
        .post-card .desc { font-size:14px; color:rgba(255,255,255,0.6); margin-bottom:8px; }
        .post-card .meta { display:flex; gap:15px; font-size:12px; color:rgba(255,255,255,0.4); flex-wrap:wrap; }
        .post-card .meta span { display:flex; align-items:center; gap:4px; }
        .post-card .badge { display:inline-block; background:rgba(255,255,255,0.05); padding:2px 10px; border-radius:12px; font-size:11px; color:rgba(255,255,255,0.5); }
        .post-card.pinned { border-color:var(--primary); }
        .post-card.pinned .title::before { content:"📌 "; }
        .search-row { display:flex; gap:10px; margin-bottom:25px; }
        .search-row input {
            flex:1; background:var(--input); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:10px 16px; color:var(--text); font-size:14px;
            outline:none; transition:.2s;
        }
        .search-row input:focus { border-color:var(--primary); }

        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-size:14px; font-weight:500; color:rgba(255,255,255,0.7); margin-bottom:4px; }
        .form-group input, .form-group textarea {
            width:100%; background:var(--input); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:10px 14px; color:var(--text); font-size:14px;
            font-family:'Inter',sans-serif; outline:none; transition:.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color:var(--primary); }
        .form-group textarea { min-height:100px; resize:vertical; }
        .chapter-block {
            background:rgba(255,255,255,0.02); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:15px; margin-bottom:15px;
            animation:slideIn 0.3s ease-out;
        }
        .chapter-block .chapter-title { font-weight:600; color:rgba(255,255,255,0.7); margin-bottom:10px; }
        .chapter-block .chapter-remove { float:right; color:#e74c3c; cursor:pointer; font-size:12px; }
        .read-header { margin-bottom:20px; }
        .read-header h1 { font-size:28px; font-weight:700; color:#fff; margin-bottom:4px; }
        .read-header .meta { display:flex; gap:15px; font-size:13px; color:rgba(255,255,255,0.5); flex-wrap:wrap; }
        .chapter-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid var(--border); }
        .chapter-nav .ch-btn { padding:6px 16px; border-radius:20px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:rgba(255,255,255,0.6); font-size:13px; cursor:pointer; transition:all 0.2s; }
        .chapter-nav .ch-btn:hover { background:rgba(255,255,255,0.1); }
        .chapter-nav .ch-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        .chapter-content { animation:slideIn 0.3s ease-out; }
        .chapter-content h2 { font-size:20px; font-weight:600; color:#fff; margin-bottom:10px; }
        .chapter-content .body { font-size:15px; line-height:1.8; color:rgba(255,255,255,0.85); white-space:pre-wrap; }
        .action-row { display:flex; gap:15px; align-items:center; margin:20px 0; padding:15px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
        .action-row .like-btn { display:flex; align-items:center; gap:6px; background:transparent; border:none; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; transition:all 0.2s; }
        .action-row .like-btn:hover { color:#fff; }
        .action-row .like-btn.liked { color:var(--primary); }
        .action-row .like-btn.pop { animation:likePop 0.4s ease; }
        .action-row .like-count { font-size:14px; color:rgba(255,255,255,0.6); margin-left:4px; }
        .comment-item { padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .comment-item .name { font-weight:600; color:rgba(255,255,255,0.8); font-size:13px; }
        .comment-item .time { font-size:11px; color:rgba(255,255,255,0.3); margin-left:8px; }
        .comment-item .text { font-size:14px; color:rgba(255,255,255,0.7); margin-top:2px; }
        .comment-form { display:flex; gap:10px; margin-top:15px; }
        .comment-form input { flex:1; background:var(--input); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 14px; color:var(--text); font-size:14px; outline:none; }
        .comment-form input:focus { border-color:var(--primary); }
        .comment-form button { padding:8px 18px; }
        .uc-panel { background:var(--card); backdrop-filter:blur(8px); border:1px solid var(--border); border-radius:var(--radius-lg); padding:30px; text-align:center; margin-bottom:25px; }
        .uc-panel .avatar { width:80px; height:80px; border-radius:50%; object-fit:cover; background:#333; margin-bottom:10px; border:2px solid var(--border); }
        .uc-panel .name { font-size:24px; font-weight:600; color:#fff; }
        .uc-panel .stats { display:flex; gap:30px; justify-content:center; margin-top:10px; font-size:14px; color:rgba(255,255,255,0.6); }
        .uc-panel .stats span { display:flex; align-items:center; gap:4px; }
        .uc-panel .stats .num { color:#fff; font-weight:600; }
        .modal-overlay {
            display:none;
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:var(--modal-bg); backdrop-filter:blur(8px);
            justify-content:center; align-items:center; z-index:9999;
        }
        .modal-overlay.active {
            display:flex;
        }
        .modal-overlay.active .modal {
            animation:modalIn 0.3s ease-out forwards;
        }
        .modal-overlay.closing .modal {
            animation:modalOut 0.2s ease-in forwards;
        }
        .modal {
            background:var(--card); backdrop-filter:blur(12px);
            border:1px solid var(--border); border-radius:var(--radius-lg);
            padding:30px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto;
        }
        .modal .title { font-size:20px; font-weight:600; color:#fff; margin-bottom:20px; }
        .modal .close { float:right; color:rgba(255,255,255,0.3); cursor:pointer; font-size:20px; }
        .modal .close:hover { color:#fff; }
        .loading-spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn.loading { pointer-events:none; opacity:0.7; }
        .empty-state { text-align:center; padding:40px 20px; color:rgba(255,255,255,0.3); }
        .empty-state .icon { font-size:48px; margin-bottom:10px; }
        @media(max-width:768px) {
            .container { padding:70px 15px 30px; }
            .nav .logo { font-size:16px; }
            .post-card { padding:15px; }
            .post-card .title { font-size:16px; }
            .uc-panel .stats { gap:15px; font-size:12px; }
            .modal { padding:20px; }
        }

        /* ===== 聊天室原版样式 ===== */
        .chat-wrapper {
            display:none;
            width:100%;
            height:calc(100vh - 140px);
            border-radius:var(--radius-lg);
            overflow:hidden;
            background:var(--card);
            border:1px solid var(--border);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
        }
        .chat-wrapper.active { display:block; }

        .wechat-layout { display:flex; height:100%; width:100%; background:var(--bg); }
        .sidebar { width:320px; min-width:320px; background:var(--card); backdrop-filter:blur(12px); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; }
        .sidebar-header { padding:var(--space-md) var(--space-lg); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); height:60px; }
        .sidebar-header .title { font-weight:600; font-size:18px; color:var(--text); }
        .sidebar-header .actions { display:flex; gap:var(--space-sm); }
        .sidebar-header .actions button { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; transition:0.2s; height:32px; }
        .sidebar-header .actions button:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
        .session-search { padding:var(--space-sm) var(--space-lg); border-bottom:1px solid var(--border); }
        .session-search input { width:100%; background:var(--input); border:1px solid var(--border); border-radius:20px; padding:8px 14px; color:var(--text); font-size:13px; outline:none; transition:0.2s; height:36px; }
        .session-search input:focus { border-color:var(--primary); }
        .session-list { flex:1; overflow-y:auto; padding:var(--space-sm) 0; }
        .session-item { padding:var(--space-sm) var(--space-lg); cursor:pointer; display:flex; align-items:center; border-bottom:1px solid var(--border); transition:0.2s; position:relative; min-height:60px; }
        .session-item:hover { background:rgba(255,255,255,0.05); }
        .session-item.active { background:rgba(68,68,68,0.15); border-left:3px solid var(--primary); }
        .session-item .avatar { width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; margin-right:var(--space-md); font-size:16px; position:relative; flex-shrink:0; }
        .session-item .avatar .online-dot { position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%; background:#4caf50; border:2px solid var(--card); }
        .session-item .avatar .online-dot.offline { background:#888; }
        .session-item .info { flex:1; min-width:0; }
        .session-item .info .name { font-weight:500; font-size:15px; display:flex; align-items:center; gap:var(--space-xs); }
        .session-item .info .last-msg { font-size:12px; color:rgba(255,255,255,0.4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .session-item .info .last-msg .unread { color:var(--primary); font-weight:500; }
        .session-item .time { font-size:11px; color:rgba(255,255,255,0.3); flex-shrink:0; margin-left:var(--space-sm); }
        .session-item .unread-badge { position:absolute; top:12px; right:20px; background:var(--primary); color:#fff; font-size:11px; padding:2px 8px; border-radius:12px; min-width:20px; text-align:center; }
        .session-item .pin-icon { color:#ffd700; font-size:12px; margin-left:var(--space-xs); }
        .chat-area { flex:1; display:flex; flex-direction:column; height:100%; background:var(--bg); }
        .chat-header { padding:var(--space-md) var(--space-lg); border-bottom:1px solid var(--border); background:var(--card); backdrop-filter:blur(8px); display:flex; justify-content:space-between; align-items:center; height:60px; }
        .chat-header .room-name { font-weight:600; font-size:18px; display:flex; align-items:center; gap:var(--space-sm); }
        .chat-header .room-name .online-status { font-size:12px; color:rgba(255,255,255,0.4); font-weight:400; }
        .chat-header .back { display:none; background:transparent; border:none; color:var(--text); font-size:18px; cursor:pointer; }
        .chat-header .right-actions { display:flex; gap:var(--space-sm); }
        .chat-header .right-actions button { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; transition:0.2s; height:32px; }
        .chat-header .right-actions button:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
        .chat-messages { flex:1; overflow-y:auto; padding:var(--space-md) var(--space-lg); display:flex; flex-direction:column; gap:var(--space-xs); }
        .system-msg { text-align:center; color:rgba(255,255,255,0.3); font-size:12px; padding:var(--space-sm) 0; margin:var(--space-xs) 0; }
        .msg-row { display:flex; align-items:flex-end; gap:var(--space-sm); max-width:70%; animation:fadeIn 0.2s; }
        .msg-row.self { align-self:flex-end; flex-direction:row-reverse; }
        .msg-row .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
        .msg-bubble { padding:8px 14px; border-radius:16px; font-size:14px; line-height:1.5; background:var(--card); border:1px solid var(--border); word-break:break-word; max-width:100%; position:relative; }
        .msg-bubble a { color:var(--primary); text-decoration:underline; }
        .msg-row.self .msg-bubble { background:var(--primary); border-color:var(--primary); color:#fff; }
        .msg-row.self .msg-bubble a { color:#fff; }
        .msg-status { font-size:10px; color:rgba(255,255,255,0.3); margin-top:2px; text-align:right; }
        .msg-status .read { color:#4caf50; }
        .chat-input-area { padding:var(--space-md) var(--space-lg); border-top:1px solid var(--border); background:var(--card); backdrop-filter:blur(8px); display:flex; gap:var(--space-sm); align-items:center; min-height:64px; }
        .chat-input-area input { flex:1; background:var(--input); border:1px solid var(--border); border-radius:24px; padding:10px 16px; color:var(--text); font-size:14px; outline:none; transition:0.2s; height:40px; }
        .chat-input-area input:focus { border-color:var(--primary); }
        .chat-input-area button { background:var(--primary); border:none; color:#fff; padding:0 20px; border-radius:24px; font-size:14px; font-weight:500; cursor:pointer; transition:0.2s; height:40px; }
        .chat-input-area button:hover { background:var(--hover); }

        // ===== Supabase 配置 =====
        const SB = supabase.createClient(

        );

        // ===== 共享状态 =====
        const CONFIG = { POSTS_PER_PAGE: 10 };
        let state = {
            user: localStorage.getItem('ape_user') || null,
            avatar: localStorage.getItem('ape_avatar') || null,
            level: parseInt(localStorage.getItem('ape_level')) || 1,
            role: localStorage.getItem('ape_role') || 'user',

            currentChapterIndex: 0,
            chapters: [],
            page: 0,
            searchQuery: '',
            isLiked: false,
            isLight: localStorage.getItem('ape_light') === 'true',
            isPerformance: localStorage.getItem('ape_performance') === 'true',
            // 聊天室状态
            currentRoomId: null,
            sessions: [],
            messages: [],
            pinned: JSON.parse(localStorage.getItem('ape_pinned') || '[]'),
            dnd: JSON.parse(localStorage.getItem('ape_dnd') || '{}'),
            unread: JSON.parse(localStorage.getItem('ape_unread') || '{}'),

        const $ = id => document.getElementById(id);

        // ===== 性能/主题 =====
        function togglePerformance() {
            state.isPerformance = !state.isPerformance;
            localStorage.setItem('ape_performance', state.isPerformance ? 'true' : 'false');
            applyPerformance();
        }
        function applyPerformance() {
            const btn = document.getElementById('perf-btn');
            if (state.isPerformance) {
                document.body.classList.add('performance-mode');
                btn.textContent = '🔋';
                btn.style.color = '#4caf50';
            } else {
                document.body.classList.remove('performance-mode');
                btn.textContent = '⚡';
                btn.style.color = '#aaa';
            }
        }
        function toggleTheme() {
            state.isLight = !state.isLight;
            localStorage.setItem('ape_light', state.isLight ? 'true' : 'false');
            applyTheme();
        }
        function applyTheme() {
            const btn = document.getElementById('theme-btn');
            if (state.isLight) {
                document.body.classList.add('light-mode');
                btn.textContent = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                btn.textContent = '🌙';
            }
        }
        function showFeedback(msg) {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 24px;border-radius:12px;font-size:14px;z-index:99999;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }

        // ===== 切换标签页 =====
        function goHome() { openForumTab(); }
        function openForumTab() {
            document.getElementById('page-forum').style.display = 'block';
            document.getElementById('page-chatroom').style.display = 'none';
            document.getElementById('page-chatroom').classList.remove('active');
            document.getElementById('nav-forum').style.color = 'var(--primary)';
            document.getElementById('nav-forum').style.fontWeight = '600';
            document.getElementById('nav-chat').style.color = '#aaa';
            document.getElementById('nav-chat').style.fontWeight = '400';
            $('page-home').style.display = 'block';
            $('page-newpost').style.display = 'none';
            $('page-read').style.display = 'none';
            loadPosts();
        }
        function openChatTab() {

        function openAuth() {
            $('auth-overlay').classList.remove('closing');
            $('auth-overlay').classList.add('active');
            $('auth-username').value = '';
            $('auth-password').value = '';
        }
        function closeAuth() {
            const overlay = $('auth-overlay');
            overlay.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active', 'closing');
            }, 200);
        }
        function toggleAuthMode() {
            state.isLogin = !state.isLogin;
            $('auth-title').textContent = state.isLogin ? '登录 APE' : '注册 APE';
            $('auth-btn').textContent = state.isLogin ? '登录' : '注册';
            $('auth-switch').innerHTML = state.isLogin ? '没有账号？ <span style="color:var(--primary);">去注册</span>' : '已有账号？ <span style="color:var(--primary);">去登录</span>';
        }
        async function handleAuth() {
            const btn = $('auth-btn');
            const orig = btn.textContent;
            btn.innerHTML = '<span class="loading-spinner"></span>处理中...';
            btn.classList.add('loading');
            const u = $('auth-username').value.trim();
            const p = $('auth-password').value.trim();
            if (!u || !p) { alert('用户名和密码不能为空'); btn.textContent = orig; btn.classList.remove('loading'); return; }
            try {
                const { data: ex } = await SB.from('users').select('*').eq('username', u);
                if (state.isLogin) {
                    if (!ex || ex.length === 0 || ex[0].password !== p) { alert('用户名或密码错误'); btn.textContent = orig; btn.classList.remove('loading'); return; }
                    state.user = u;
                    state.avatar = ex[0].avatar_url || null;
                    state.level = ex[0].level || 1;
                    state.role = ex[0].role || 'user';
                    localStorage.setItem('ape_user', u);
                    if (state.avatar) localStorage.setItem('ape_avatar', state.avatar);
                    localStorage.setItem('ape_level', state.level);
                    localStorage.setItem('ape_role', state.role);
                    closeAuth();
                    updateUI();
                    goHome();
                    showFeedback('登录成功！');
                } else {
                    if (ex && ex.length > 0) { alert('用户名已被注册'); btn.textContent = orig; btn.classList.remove('loading'); return; }
                    let avatarUrl = null;
                    const { error: ie } = await SB.from('users').insert({
                        username: u,
                        password: p,
                        avatar_url: avatarUrl,
                        level: 1,
                        role: 'user'
                    });
                    if (ie) { alert('注册失败: ' + ie.message); btn.textContent = orig; btn.classList.remove('loading'); return; }
                    state.user = u;
                    state.avatar = avatarUrl;
                    state.level = 1;
                    state.role = 'user';
                    localStorage.setItem('ape_user', u);
                    localStorage.setItem('ape_level', '1');
                    localStorage.setItem('ape_role', 'user');
                    closeAuth();
                    updateUI();
                    goHome();
                    showFeedback('🎉 欢迎加入 ' + u);
                }
            } catch (e) { alert('操作失败，请重试'); } finally {
                btn.textContent = orig;
                btn.classList.remove('loading');
            }
        }
        function openUserCenter(targetUser) {
            const username = targetUser || state.user;
            if (!username) { openAuth(); return; }
            $('uc-overlay').classList.remove('closing');
            $('uc-overlay').classList.add('active');
            const img = $('uc-avatar');
            if (targetUser && targetUser !== state.user) {
                img.style.display = 'none';
            } else if (state.avatar) {
                img.src = state.avatar;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            $('uc-name').textContent = username;
            loadUserStats(username);
        }
        function closeUserCenter() {
            const overlay = $('uc-overlay');
            overlay.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('active', 'closing');
            }, 200);
        }
        async function loadUserStats(username) {
            const { count: postCount } = await SB.from('posts').select('id', { count: 'exact', head: true }).eq('username', username);
            const { data: likesData } = await SB.from('likes').select('id').eq('username', username);
            $('uc-post-count').textContent = postCount || 0;
            $('uc-like-count').textContent = likesData ? likesData.length : 0;
            const { data: posts } = await SB.from('posts').select('id, title, created_at').eq('username', username).order('created_at', { ascending: false });
            const list = $('uc-post-list');

            } else {

        function logoutUser() {

        async function loadUserList() {

        async function setUserRole(username, role) {
            if (!confirm(`确认把 ${username} 设为 ${role === 'admin' ? '管理员' : '普通用户'} 吗？`)) return;
            const { error } = await SB.from('users').update({ role }).eq('username', username);
            if (error) { showFeedback('操作失败: ' + error.message); return; }

        async function loadPosts(reset = true) {
            if (reset) { state.page = 0;
                $('post-list').innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">加载中...</div>'; }
            const q = SB.from('posts').select('id, username, title, description, views, created_at, is_pinned', { count: 'exact' });
            if (state.searchQuery) q.ilike('title', `%${state.searchQuery}%`);
            q.order('is_pinned', { ascending: false });
            q.order('created_at', { ascending: false });
            q.range(state.page * CONFIG.POSTS_PER_PAGE, (state.page + 1) * CONFIG.POSTS_PER_PAGE - 1);
            const { data, count } = await q;
            if (reset) $('post-list').innerHTML = '';
            if (!data || data.length === 0) {
                if (reset) $('post-list').innerHTML = '<div class="empty-state"><div class="icon">📭</div>还没有帖子</div>';
                $('load-more-btn').style.display = 'none';
                return;
            }
            const postIds = data.map(p => p.id);
            const { data: likesData } = await SB.from('likes').select('post_id').in('post_id', postIds);
            const { data: commentsData } = await SB.from('comments').select('post_id').in('post_id', postIds);
            const likeMap = {};
            const commentMap = {};
            if (likesData) likesData.forEach(l => { likeMap[l.post_id] = (likeMap[l.post_id] || 0) + 1; });
            if (commentsData) commentsData.forEach(c => { commentMap[c.post_id] = (commentMap[c.post_id] || 0) + 1; });
            const list = $('post-list');
            data.forEach(p => {
                const likes = likeMap[p.id] || 0;
                const comments = commentMap[p.id] || 0;
                const time = new Date(p.created_at);
                const timeStr = `${time.getFullYear()}.${String(time.getMonth()+1).padStart(2,'0')}.${String(time.getDate()).padStart(2,'0')}`;
                const div = document.createElement('div');
                div.className = 'post-card' + (p.is_pinned ? ' pinned' : '');
                div.innerHTML = `
                    <div class="title">${p.title}</div>
                    ${p.description ? `<div class="desc">${p.description}</div>` : ''}
                    <div class="meta">
                        <span>👤 ${p.username}</span>
                        <span>🕐 ${timeStr}</span>
                        <span>👍 ${likes}</span>
                        <span>💬 ${comments}</span>
                        <span>👁️ ${p.views || 0}</span>
                        ${p.is_pinned ? '<span class="badge">置顶</span>' : ''}
                    </div>
                `;
                div.onclick = () => readPost(p.id);
                list.appendChild(div);
            });
            if (count > (state.page + 1) * CONFIG.POSTS_PER_PAGE) {
                $('load-more-btn').style.display = 'inline-block';
            } else {
                $('load-more-btn').style.display = 'none';
            }
        }
        function loadMore() { state.page++;
            loadPosts(false); }
        function searchPosts() {
            state.searchQuery = $('search-input').value.trim();
            loadPosts(true);
        }
        async function readPost(id) {
            $('page-home').style.display = 'none';
            $('page-newpost').style.display = 'none';
            $('page-read').style.display = 'block';
            const { data: post } = await SB.from('posts').select('*').eq('id', id).single();
            if (!post) { showFeedback('帖子不存在'); goHome(); return; }
            state.currentPost = post;
            state.currentChapterIndex = 0;
            await SB.from('posts').update({ views: (post.views || 0) + 1 }).eq('id', id);
            $('read-title').textContent = post.title;
            $('read-author').textContent = '👤 ' + post.username;
            $('read-time').textContent = '🕐 ' + new Date(post.created_at).toLocaleString();
            $('read-views').textContent = '👁️ ' + (post.views || 0);
            if (state.user === post.username || state.role === 'admin' || state.role === 'super_admin') {
                $('delete-post-btn').style.display = 'inline-block';
                $('delete-post-btn').style.borderColor = '#e74c3c';
                $('delete-post-btn').style.color = '#e74c3c';
            } else {
                $('delete-post-btn').style.display = 'none';
            }
            if (state.role === 'admin' || state.role === 'super_admin') {
                $('pin-post-btn').style.display = 'inline-block';
                $('pin-post-btn').textContent = post.is_pinned ? '取消置顶' : '置顶';
            } else {
                $('pin-post-btn').style.display = 'none';
            }
            const { data: chapters } = await SB.from('chapters').select('*').eq('post_id', id).order('order_index', { ascending: true });
            state.chapters = chapters || [];
            renderChapterNav();
            renderChapter(0);
            if (state.user) {
                const { data: likeCheck } = await SB.from('likes').select('id').eq('post_id', id).eq('username', state.user);
                state.isLiked = likeCheck && likeCheck.length > 0;
                updateLikeUI();
            }
            loadLikesComments();
        }
        async function togglePin() {
            if (state.role !== 'admin' && state.role !== 'super_admin') return;
            const id = state.currentPost.id;
            const newVal = !state.currentPost.is_pinned;
            await SB.from('posts').update({ is_pinned: newVal }).eq('id', id);
            state.currentPost.is_pinned = newVal;
            showFeedback(newVal ? '✅ 已置顶' : '已取消置顶');
            readPost(id);
        }
        function renderChapterNav() {
            const nav = $('chapter-nav');
            nav.innerHTML = state.chapters.map((ch, i) =>
                `<button class="ch-btn ${i === state.currentChapterIndex ? 'active' : ''}" onclick="renderChapter(${i})">${ch.title || '第'+(i+1)+'章'}</button>`
            ).join('');
        }
        function renderChapter(index) {
            state.currentChapterIndex = index;
            const ch = state.chapters[index];
            if (!ch) { $('chapter-content').innerHTML = '<div style="color:rgba(255,255,255,0.3);">章节不存在</div>'; return; }
            renderChapterNav();
            let html = `<h2>${ch.title}</h2>`;
            html += `<div class="body">${ch.content.replace(/\n/g, '<br>')}</div>`;
            $('chapter-content').innerHTML = html;
        }
        async function loadLikesComments() {
            const id = state.currentPost.id;
            const { count: likeCount } = await SB.from('likes').select('id', { count: 'exact', head: true }).eq('post_id', id);
            $('like-count').textContent = likeCount || 0;
            $('read-likes-count').textContent = '👍 ' + (likeCount || 0);
            const { data: comments, error } = await SB.from('comments').select('*').eq('post_id', id).order('created_at', { ascending: false });
            if (error) {
                console.error('评论加载失败:', error);
                showFeedback('评论加载失败');
                return;
            }
            const list = $('comments-list');
            const countEl = document.getElementById('read-comments-count');
            if (!comments || comments.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:10px;">还没有评论</div>';
                if (countEl) countEl.textContent = '💬 0';
                return;
            }
            if (countEl) countEl.textContent = '💬 ' + comments.length;
            list.innerHTML = comments.map(c =>
                `<div class="comment-item">
                    <span class="name">${c.username}</span>
                    <span class="time">${new Date(c.created_at).toLocaleString()}</span>
                    <div class="text">${c.content}</div>
                </div>`
            ).join('');
        }
        async function toggleLike() {
            if (!state.user) { openAuth(); return; }
            const id = state.currentPost.id;
            if (state.isLiked) {
                await SB.from('likes').delete().eq('post_id', id).eq('username', state.user);
                state.isLiked = false;
            } else {
                await SB.from('likes').insert({ post_id: id, username: state.user });
                state.isLiked = true;
            }
            const btn = $('like-btn');
            btn.classList.remove('pop');
            void btn.offsetWidth;
            btn.classList.add('pop');
            updateLikeUI();
            loadLikesComments();
        }
        function updateLikeUI() {
            const btn = $('like-btn');
            if (state.isLiked) {
                btn.classList.add('liked');
                $('like-text').textContent = '已赞';
            } else {
                btn.classList.remove('liked');
                $('like-text').textContent = '点赞';
            }
        }
        async function submitComment() {
            if (!state.user) { openAuth(); return; }
            const input = $('comment-input');
            const text = input.value.trim();
            if (!text) { showFeedback('请输入评论内容'); return; }
            const { error } = await SB.from('comments').insert({
                post_id: state.currentPost.id,
                username: state.user,
                content: text
            });
            if (error) {
                showFeedback('评论发送失败: ' + error.message);
                return;
            }
            input.value = '';
            showFeedback('✅ 评论已发送');
            await loadLikesComments();
        }
        async function deleteCurrentPost() {
            if (!confirm('确认删除这个帖子吗？（所有章节、点赞、评论都会被删除）')) return;
            await SB.from('posts').delete().eq('id', state.currentPost.id);
            showFeedback('帖子已删除');

            if (!state.user) { openAuth(); return; }
            $('page-home').style.display = 'none';
            $('page-newpost').style.display = 'block';
            $('page-read').style.display = 'none';

            $('chapters-container').innerHTML = `
                <div class="chapter-block" data-index="0">

        function addChapter() {
            const container = $('chapters-container');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = 'chapter-block';
            div.dataset.index = index;
            div.innerHTML = `
                <div class="chapter-title">第 ${index+1} 章<span class="chapter-remove" onclick="removeChapter(this)">✕</span></div>

        function removeChapter(el) {
            const block = el.closest('.chapter-block');
            if (document.querySelectorAll('.chapter-block').length <= 1) { showFeedback('至少保留一章'); return; }
            block.remove();
            document.querySelectorAll('.chapter-block').forEach((b, i) => {
                b.dataset.index = i;
                b.querySelector('.chapter-title').innerHTML = `第 ${i+1} 章<span class="chapter-remove" onclick="removeChapter(this)">✕</span>`;
            });
        }
        async function submitPost() {
            const btn = $('submit-btn');
            const orig = btn.textContent;
            btn.innerHTML = '<span class="loading-spinner"></span>发布中...';
            btn.classList.add('loading');
            const title = $('np-title').value.trim();
            const desc = $('np-desc').value.trim();
            if (!title) { showFeedback('请填写标题');
                btn.textContent = orig;
                btn.classList.remove('loading'); return; }
            const chapterBlocks = document.querySelectorAll('.chapter-block');
            const chapters = [];
            for (const block of chapterBlocks) {
                const chTitle = block.querySelector('.ch-title').value.trim();
                const chContent = block.querySelector('.ch-content').value.trim();
                if (!chTitle || !chContent) { showFeedback('请填写所有章节的标题和正文');
                    btn.textContent = orig;
                    btn.classList.remove('loading'); return; }
                chapters.push({ title: chTitle, content: chContent });
            }
            if (chapters.length === 0) { showFeedback('请至少添加一个章节');
                btn.textContent = orig;
                btn.classList.remove('loading'); return; }
            try {
                const { data: post, error: postErr } = await SB.from('posts').insert({
                    username: state.user,
                    title: title,
                    description: desc
                }).select().single();
                if (postErr) { showFeedback('创建帖子失败: ' + postErr.message);
                    btn.textContent = orig;
                    btn.classList.remove('loading'); return; }
                for (let i = 0; i < chapters.length; i++) {
                    await SB.from('chapters').insert({
                        post_id: post.id,
                        title: chapters[i].title,
                        content: chapters[i].content,
                        order_index: i + 1
                    });
                }
                showFeedback('🎉 帖子发布成功！');
                goHome();
            } catch (e) { showFeedback('发布失败，请重试'); } finally {
                btn.textContent = orig;
                btn.classList.remove('loading');
            }
        }

        // ===== 聊天室函数 =====
        function showToast(msg, type = 'info') {
            const colors = { info: '#444', success: '#4caf50', error: '#e74c3c' };
            const div = document.createElement('div');
            div.style.cssText = `
                position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
                background:${colors[type] || '#444'}; color:#fff;
                padding:10px 24px; border-radius:12px; font-size:14px;
                z-index:99999; backdrop-filter:blur(8px);
                border:1px solid rgba(255,255,255,0.1);
                box-shadow:0 4px 20px rgba(0,0,0,0.3);
                animation:fadeIn 0.3s ease-out;
            `;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2500);
        }
        function setColor(color) {
            state.themeColor = color;
            localStorage.setItem('ape_theme_color', color);
            applyTheme();
            showToast('主题色已更新');
        }
        function setTheme(mode) {
            state.lightMode = mode === 'light';
            localStorage.setItem('ape_light_mode', state.lightMode ? 'true' : 'false');
            applyTheme();
            showToast(mode === 'light' ? '已切换浅色模式' : '已切换深色模式');
        }
        function openThemeModal() { $('theme-modal').classList.add('active'); }
        function closeThemeModal() { $('theme-modal').classList.remove('active'); }
        async function refreshUserProfile() {
            if (!state.user) return;
            try {
                const { data, error } = await SB.from('users').select('role, avatar_url').eq('username', state.user).single();
                if (data && !error) {
                    state.role = data.role || 'user';
                    state.avatar = data.avatar_url || null;
                    localStorage.setItem('ape_role', state.role);
                    if (state.avatar) localStorage.setItem('ape_avatar', state.avatar);
                }
            } catch (e) {
                console.error('加载用户信息失败:', e);
            }
        }
        function generateRoomCode() {
            const now = new Date();
            const y = String(now.getFullYear()).slice(2);
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return y + m + d + h + min;
        }
        async function loadSessions() {
            const list = $('session-list');
            const { data: roomData } = await SB
                .from('room_members')
                .select('room_id, rooms(id, name, creator_username, announcement, code)')
                .eq('username', state.user);
            let sessions = [];
            if (roomData) {
                roomData.forEach(r => {
                    sessions.push({
                        id: r.room_id,
                        type: 'room',
                        name: r.rooms.name,
                        avatar: r.rooms.name.charAt(0),
                        lastTime: r.rooms.created_at,
                        lastMsg: '点击进入聊天',
                        creator: r.rooms.creator_username,
                        announcement: r.rooms.announcement,
                        code: r.rooms.code
                    });
                });
            }
            const apeCreated = localStorage.getItem('ape_created') === 'true';
            if (!apeCreated) {
                const { data: existing } = await SB.from('rooms').select('id').eq('name', 'APE审核群');
                if (!existing || existing.length === 0) {
                    const code = generateRoomCode();
                    await SB.from('rooms').insert({
                        name: 'APE审核群',
                        creator_username: '系统',
                        code: code
                    });
                    localStorage.setItem('ape_created', 'true');
                }
                loadSessions();
                return;
            }
            sessions.sort((a, b) => {
                const aPinned = state.pinned.includes(a.id);
                const bPinned = state.pinned.includes(b.id);
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                return new Date(b.lastTime) - new Date(a.lastTime);
            });
            state.sessions = sessions;
            if (sessions.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📭</div>暂无聊天</div>';
                return;
            }
            list.innerHTML = sessions.map(s => {
                const isPinned = state.pinned.includes(s.id);
                const isDND = state.dnd[s.id] || false;
                const unreadCount = state.unread[s.id] || 0;
                const isActive = s.id === state.currentRoomId;
                return `
                    <div class="session-item ${isActive ? 'active' : ''}" onclick="openSession('${s.id}')" data-id="${s.id}">
                        <div class="avatar">${s.avatar}
                            <div class="online-dot online"></div>
                        </div>
                        <div class="info">
                            <div class="name">
                                ${s.name}
                                ${isPinned ? '<span class="pin-icon">📌</span>' : ''}
                                ${isDND ? '<span style="font-size:12px;">🔕</span>' : ''}
                                ${s.code ? `<span style="font-size:11px;color:rgba(255,255,255,0.3);margin-left:4px;">#${s.code}</span>` : ''}
                            </div>
                            <div class="last-msg ${unreadCount > 0 ? 'unread' : ''}">${s.lastMsg}</div>
                        </div>
                        <div class="time">${formatTime(s.lastTime)}</div>
                        ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        function formatTime(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = (now - d) / (1000 * 60 * 60);
            if (diff < 24) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
        }
        function searchSessions() {
            const q = $('search-input').value.toLowerCase();
            document.querySelectorAll('.session-item').forEach(el => {
                const name = el.querySelector('.name')?.textContent?.toLowerCase() || '';
                el.style.display = name.includes(q) ? 'flex' : 'none';
            });
        }
        async function openSession(id) {
            state.currentRoomId = id;
            const session = state.sessions.find(s => s.id === id);
            if (!session) return;
            if (state.unread[id]) {
                delete state.unread[id];
                localStorage.setItem('ape_unread', JSON.stringify(state.unread));
            }
            $('current-room-name').innerHTML = `${session.name} <span class="online-status">群聊</span>`;
            $('pin-btn').textContent = state.pinned.includes(id) ? '📌 已置顶' : '📌 置顶';
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.session-item[data-id="${id}"]`);
            if (target) target.classList.add('active');
            subscribeToMessages(id);
            await loadMessages(id);
            loadSessions();
            setTimeout(() => $('msg-input').focus(), 300);
        }
        function subscribeToMessages(roomId) {
            if (state.messageSubscription) {
                SB.removeChannel(state.messageSubscription);
                state.messageSubscription = null;
            }
            state.messageSubscription = SB
                .channel('messages-channel-' + roomId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `room_id=eq.${roomId}`
                }, payload => {
                    if (state.currentRoomId === roomId) {
                        loadMessages(roomId);
                        const container = $('chat-messages');
                        container.scrollTop = container.scrollHeight;
                    }
                    loadSessions();
                })
                .subscribe();
        }
        async function loadMessages(roomId) {
            const container = $('chat-messages');
            const { data, error } = await SB
                .from('messages')
                .select('*')
                .eq('room_id', roomId)
                .order('created_at', { ascending: true });
            if (error) {
                console.error('加载消息失败:', error);
                showToast('加载消息失败', 'error');
                return;
            }
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="icon">💬</div>暂无消息</div>';
                return;
            }
            state.messages = data;
            let lastDate = '';
            container.innerHTML = data.map(msg => {
                const isSelf = msg.username === state.user;
                const msgDate = new Date(msg.created_at).toLocaleDateString();
                let dateDiv = '';
                if (msgDate !== lastDate) {
                    dateDiv = `<div class="system-msg">${msgDate}</div>`;
                    lastDate = msgDate;
                }
                let content = msg.content;
                const tempDiv = document.createElement('div');
                tempDiv.textContent = content;
                content = tempDiv.innerHTML;
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                content = content.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
                if (msg.is_system) {
                    return `<div class="system-msg">${content}</div>`;
                }
                return `
                    ${dateDiv}
                    <div class="msg-row ${isSelf ? 'self' : ''}">
                        <div class="avatar">${msg.username.charAt(0)}</div>
                        <div class="msg-bubble">${content}</div>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }
        let isSending = false;
        async function sendMessage() {
            if (!state.user) { showToast('请先登录', 'error'); return; }
            if (!state.currentRoomId) { showToast('请先选择一个聊天', 'error'); return; }
            if (isSending) return;
            const input = $('msg-input');
            const content = input.value.trim();
            if (!content) return;
            isSending = true;
            const btn = document.querySelector('.chat-input-area button');
            const origText = btn.textContent;
            btn.textContent = '发送中...';
            btn.disabled = true;
            try {
                const { error } = await SB.from('messages').insert({
                    room_id: state.currentRoomId,
                    username: state.user,
                    content: content,
                    is_system: false
                });
                if (error) {
                    showToast('发送失败: ' + error.message, 'error');
                    return;
                }
                input.value = '';
                await loadMessages(state.currentRoomId);
                loadSessions();
                const container = $('chat-messages');
                container.scrollTop = container.scrollHeight;
                setTimeout(() => input.focus(), 100);
            } catch (e) {
                console.error(e);
                showToast('发送异常，请重试', 'error');
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
                isSending = false;
            }
        }
        function togglePin() {
            const id = state.currentRoomId;
            if (!id) return;
            const idx = state.pinned.indexOf(id);
            if (idx > -1) state.pinned.splice(idx, 1);
            else state.pinned.push(id);
            localStorage.setItem('ape_pinned', JSON.stringify(state.pinned));
            $('pin-btn').textContent = state.pinned.includes(id) ? '📌 已置顶' : '📌 置顶';
            loadSessions();
        }
        function toggleDND() {
            const id = state.currentRoomId;
            if (!id) return;
            state.dnd[id] = $('room-dnd').checked;
            localStorage.setItem('ape_dnd', JSON.stringify(state.dnd));
        }
        function deleteSession() {
            if (!confirm('确认删除该会话？聊天记录和成员记录将被清除。')) return;
            const id = state.currentRoomId;
            if (!id) return;
            SB.from('messages').delete().eq('room_id', id);
            SB.from('room_members').delete().eq('room_id', id);
            closeChat();
            loadSessions();
            closeRoomSettings();
            showToast('会话已删除');
        }
        async function destroyRoom() {
            if (!confirm('⚠️ 确认解散这个群聊吗？所有成员、消息将全部删除，不可恢复！')) return;
            const id = state.currentRoomId;
            if (!id) return;
            const { error } = await SB.from('rooms').delete().eq('id', id);
            if (error) {
                showToast('解散失败: ' + error.message, 'error');
                return;
            }
            closeChat();
            loadSessions();
            closeRoomSettings();
            showToast('群聊已解散', 'success');
        }
        function openCreateRoomModal() {
            if (!state.user) { showToast('请先登录', 'error'); return; }
            $('create-room-modal').classList.add('active');
            $('new-room-name').value = '';
        }
        function closeCreateRoomModal() { $('create-room-modal').classList.remove('active'); }
        async function createRoom() {
            const name = $('new-room-name').value.trim();
            if (!name) { showToast('请输入群聊名称', 'error'); return; }
            const code = generateRoomCode();
            const { data: room, error: roomErr } = await SB.from('rooms').insert({
                name: name,
                creator_username: state.user,
                code: code
            }).select().single();
            if (roomErr) { showToast('创建失败: ' + roomErr.message, 'error'); return; }
            await SB.from('room_members').insert({
                room_id: room.id,
                username: state.user,
                role: 'admin'
            });
            await SB.from('messages').insert({
                room_id: room.id,
                username: '系统',
                content: `群聊 "${name}" 已创建，群号: ${code}`,
                is_system: true
            });
            closeCreateRoomModal();
            await loadSessions();
            openSession(room.id);
            showToast('群聊创建成功！', 'success');
        }
        function openMemberModal() {
            if (!state.currentRoomId) { showToast('请先选择一个群聊', 'error'); return; }
            $('member-modal').classList.add('active');
            loadMembers(state.currentRoomId);
        }
        function closeMemberModal() { $('member-modal').classList.remove('active'); }
        async function loadMembers(roomId) {
            const list = $('member-list');
            const { data, error } = await SB.from('room_members').select('username, role').eq('room_id', roomId);
            if (error) { console.error(error); return; }
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);">暂无成员</div>';
                return;
            }
            const { data: roomData } = await SB.from('rooms').select('creator_username').eq('id', roomId).single();
            const creator = roomData?.creator_username || '';
            $('member-count').textContent = `(${data.length}人)`;
            const { data: myRoleData } = await SB.from('room_members')
                .select('role')
                .eq('room_id', roomId)
                .eq('username', state.user)
                .single();
            const myRole = myRoleData?.role || 'member';
            const isSuperAdmin = state.role === 'super_admin';
            const canManage = isSuperAdmin || (state.user === creator) || (myRole === 'admin');
            list.innerHTML = data.map(m => {
                const isCreator = m.username === creator;
                const isSelf = m.username === state.user;
                const roleLabel = isCreator ? '👑 群主' : (m.role === 'admin' ? '🛡️ 管理员' : '👤 成员');
                const roleClass = isCreator ? 'owner' : (m.role === 'admin' ? 'admin' : '');
                let actionsHtml = '';
                if (canManage && !isSelf && !isCreator) {
                    if (m.role === 'admin') {
                        actionsHtml = `
                            <button class="btn-set-member" onclick="setMemberRole('${roomId}', '${m.username}', 'member')">撤销管理</button>
                            <button class="btn-remove" onclick="removeMember('${roomId}', '${m.username}')">移出</button>
                        `;
                    } else {
                        actionsHtml = `
                            <button class="btn-set-admin" onclick="setMemberRole('${roomId}', '${m.username}', 'admin')">设为管理</button>
                            <button class="btn-remove" onclick="removeMember('${roomId}', '${m.username}')">移出</button>
                        `;
                    }
                }
                return `
                    <div class="member-item">
                        <div class="name">
                            <span class="online-dot-sm online"></span>
                            ${m.username} ${isSelf ? '(我)' : ''}
                            <span class="role-badge ${roleClass}">${roleLabel}</span>
                        </div>
                        <div class="actions">${actionsHtml}</div>
                    </div>
                `;
            }).join('');
        }
        async function setMemberRole(roomId, username, role) {
            if (!confirm(`确认将 ${username} 设为 ${role === 'admin' ? '管理员' : '普通成员'} 吗？`)) return;
            const { error } = await SB.from('room_members').update({ role }).eq('room_id', roomId).eq('username', username);
            if (error) { showToast('操作失败: ' + error.message, 'error'); return; }
            loadMembers(roomId);
            showToast('角色已更新', 'success');
        }
        async function removeMember(roomId, username) {
            if (!confirm(`确认将 ${username} 移出群聊吗？`)) return;
            const { error } = await SB.from('room_members').delete().eq('room_id', roomId).eq('username', username);
            if (error) { showToast('操作失败: ' + error.message, 'error'); return; }
            loadMembers(roomId);
            showToast('已移出群聊', 'success');
        }
        async function openRoomSettings() {
            if (!state.currentRoomId) { showToast('请先选择一个群聊', 'error'); return; }
            $('room-settings-modal').classList.add('active');
            const { data: room } = await SB.from('rooms').select('code, announcement, creator_username').eq('id', state.currentRoomId).single();
            if (room) {
                $('room-code').textContent = room.code || generateRoomCode();
                $('room-announcement').value = room.announcement || '';
                const isOwner = state.user === room.creator_username;
                const isSuperAdmin = state.role === 'super_admin';
                if (isOwner || isSuperAdmin) {
                    document.getElementById('destroy-room-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('destroy-room-btn').style.display = 'none';
                }
            }
            $('room-dnd').checked = state.dnd[state.currentRoomId] || false;
        }
        function closeRoomSettings() { $('room-settings-modal').classList.remove('active'); }
        async function updateAnnouncement() {
            const text = $('room-announcement').value.trim();
            await SB.from('rooms').update({ announcement: text }).eq('id', state.currentRoomId);
            if (text) {
                await SB.from('messages').insert({
                    room_id: state.currentRoomId,
                    username: '系统',
                    content: `📢 群公告: ${text}`,
                    is_system: true
                });
                await loadMessages(state.currentRoomId);
                showToast('公告已发布', 'success');
            }
        }

        // ===== 初始化 =====
        applyPerformance();
        applyTheme();
        updateUI();
        goHome();
        refreshUserProfile();
    </script>
</body>
</html>
