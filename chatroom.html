<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APE 聊天</title>
    <link rel="icon" type="image/png" href="https://bee-reg-ab.imagency.cn/p/52395a583541e8836c1e7f9b4332aba1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; }
        body {
            background:var(--bg); color:var(--text);
            font-family:'Inter',sans-serif; font-weight:400;
            height:100vh; overflow:hidden;
        }
        :root {
            --primary:#444; --hover:#222; --shadow:rgba(68,68,68,0.3);
            --bg:#12121a; --text:#e0e0e0; --card:rgba(30,30,40,0.85);
            --border:rgba(255,255,255,0.06); --input:rgba(255,255,255,0.05);
            --nav-bg:rgba(10,10,10,0.75);
            --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
            --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px;
        }
        body.light-mode {
            --bg:#f0f2f5; --text:#1a1a2e; --card:rgba(255,255,255,0.9);
            --border:rgba(0,0,0,0.06); --input:rgba(0,0,0,0.03);
            --nav-bg:rgba(255,255,255,0.9);
        }

        .wechat-layout { display:flex; height:100vh; width:100%; background:var(--bg); }
        .sidebar { width:320px; min-width:320px; background:var(--card); backdrop-filter:blur(12px); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100%; }
        .sidebar-header { padding:var(--space-md) var(--space-lg); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); height:60px; }
        .sidebar-header .title { font-weight:600; font-size:18px; color:var(--text); }
        .sidebar-header .actions { display:flex; gap:var(--space-sm); }
        .sidebar-header .actions button { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; transition:0.2s; height:32px; }
        .sidebar-header .actions button:hover { background:var(--primary); color:#fff; border-color:var(--primary); }

        .session-search { padding:var(--space-sm) var(--space-lg); border-bottom:1px solid var(--border); }
        .session-search input { width:100%; background:var(--input); border:1px solid var(--border); border-radius:20px; padding:8px 14px; color:var(--text); font-size:13px; outline:none; transition:0.2s; height:36px; }
        .session-search input:focus { border-color:var(--primary); }

        .session-list { flex:1; overflow-y:auto; padding:var(--space-sm) 0; }
        .session-item { padding:var(--space-sm) var(--space-lg); cursor:pointer; display:flex; align-items:center; border-bottom:1px solid var(--border); transition:0.2s; position:relative; min-height:60px; }
        .session-item:hover { background:rgba(255,255,255,0.05); }
        .session-item.active { background:rgba(68,68,68,0.15); border-left:3px solid var(--primary); }
        .session-item .avatar { width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; margin-right:var(--space-md); font-size:16px; position:relative; flex-shrink:0; }
        .session-item .avatar .online-dot { position:absolute; bottom:0; right:0; width:12px; height:12px; border-radius:50%; background:#4caf50; border:2px solid var(--card); }
        .session-item .avatar .online-dot.offline { background:#888; }
        .session-item .info { flex:1; min-width:0; }
        .session-item .info .name { font-weight:500; font-size:15px; display:flex; align-items:center; gap:var(--space-xs); }
        .session-item .info .last-msg { font-size:12px; color:rgba(255,255,255,0.4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .session-item .info .last-msg .unread { color:var(--primary); font-weight:500; }
        .session-item .time { font-size:11px; color:rgba(255,255,255,0.3); flex-shrink:0; margin-left:var(--space-sm); }
        .session-item .unread-badge { position:absolute; top:12px; right:20px; background:var(--primary); color:#fff; font-size:11px; padding:2px 8px; border-radius:12px; min-width:20px; text-align:center; }
        .session-item .pin-icon { color:#ffd700; font-size:12px; margin-left:var(--space-xs); }

        .chat-area { flex:1; display:flex; flex-direction:column; height:100%; background:var(--bg); }
        .chat-header { padding:var(--space-md) var(--space-lg); border-bottom:1px solid var(--border); background:var(--card); backdrop-filter:blur(8px); display:flex; justify-content:space-between; align-items:center; height:60px; }
        .chat-header .room-name { font-weight:600; font-size:18px; display:flex; align-items:center; gap:var(--space-sm); }
        .chat-header .room-name .online-status { font-size:12px; color:rgba(255,255,255,0.4); font-weight:400; }
        .chat-header .back { display:none; background:transparent; border:none; color:var(--text); font-size:18px; cursor:pointer; }
        .chat-header .right-actions { display:flex; gap:var(--space-sm); }
        .chat-header .right-actions button { background:transparent; border:1px solid var(--border); color:var(--text); padding:4px 12px; border-radius:20px; font-size:12px; cursor:pointer; transition:0.2s; height:32px; }
        .chat-header .right-actions button:hover { background:var(--primary); color:#fff; border-color:var(--primary); }

        .chat-messages { flex:1; overflow-y:auto; padding:var(--space-md) var(--space-lg); display:flex; flex-direction:column; gap:var(--space-xs); }
        .system-msg { text-align:center; color:rgba(255,255,255,0.3); font-size:12px; padding:var(--space-sm) 0; margin:var(--space-xs) 0; }
        .msg-row { display:flex; align-items:flex-end; gap:var(--space-sm); max-width:70%; animation:fadeIn 0.2s; }
        .msg-row.self { align-self:flex-end; flex-direction:row-reverse; }
        .msg-row .avatar { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0; }
        .msg-bubble { padding:8px 14px; border-radius:16px; font-size:14px; line-height:1.5; background:var(--card); border:1px solid var(--border); word-break:break-word; max-width:100%; position:relative; }
        .msg-bubble a { color:var(--primary); text-decoration:underline; }
        .msg-row.self .msg-bubble { background:var(--primary); border-color:var(--primary); color:#fff; }
        .msg-row.self .msg-bubble a { color:#fff; }
        .msg-status { font-size:10px; color:rgba(255,255,255,0.3); margin-top:2px; text-align:right; }
        .msg-status .read { color:#4caf50; }

        .chat-input-area { padding:var(--space-md) var(--space-lg); border-top:1px solid var(--border); background:var(--card); backdrop-filter:blur(8px); display:flex; gap:var(--space-sm); align-items:center; min-height:64px; }
        .chat-input-area input { flex:1; background:var(--input); border:1px solid var(--border); border-radius:24px; padding:10px 16px; color:var(--text); font-size:14px; outline:none; transition:0.2s; height:40px; }
        .chat-input-area input:focus { border-color:var(--primary); }
        .chat-input-area button { background:var(--primary); border:none; color:#fff; padding:0 20px; border-radius:24px; font-size:14px; font-weight:500; cursor:pointer; transition:0.2s; height:40px; }
        .chat-input-area button:hover { background:var(--hover); }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); justify-content:center; align-items:center; z-index:9999; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--card); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:16px; padding:var(--space-lg); max-width:420px; width:90%; max-height:80vh; overflow-y:auto; }
        .modal h3 { margin-bottom:var(--space-md); font-size:18px; }
        .modal input, .modal textarea { width:100%; background:var(--input); border:1px solid var(--border); border-radius:12px; padding:10px 14px; color:var(--text); font-size:14px; outline:none; margin-bottom:var(--space-sm); font-family:inherit; height:40px; }
        .modal textarea { height:auto; min-height:80px; }
        .modal input:focus, .modal textarea:focus { border-color:var(--primary); }
        .modal .btn-row { display:flex; gap:var(--space-sm); justify-content:flex-end; }
        .modal .btn-row button { padding:8px 20px; border-radius:12px; border:none; cursor:pointer; font-size:14px; height:36px; }
        .modal .btn-row .cancel { background:var(--input); color:var(--text); }
        .modal .btn-row .confirm { background:var(--primary); color:#fff; }
        .modal .btn-row .confirm:hover { background:var(--hover); }

        .member-item { display:flex; justify-content:space-between; align-items:center; padding:var(--space-sm) 0; border-bottom:1px solid var(--border); }
        .member-item .name { font-size:14px; display:flex; align-items:center; gap:var(--space-sm); }
        .member-item .name .online-dot-sm { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .member-item .name .online-dot-sm.online { background:#4caf50; }
        .member-item .name .online-dot-sm.offline { background:#888; }
        .member-item .role-badge { font-size:11px; padding:2px 10px; border-radius:12px; background:rgba(255,255,255,0.05); }
        .member-item .role-badge.admin { background:var(--primary); color:#fff; }
        .member-item .role-badge.owner { background:#ffd700; color:#1a1a2e; }
        .member-item .actions { display:flex; gap:var(--space-xs); }
        .member-item .actions button { padding:2px 10px; border-radius:12px; border:none; font-size:11px; cursor:pointer; transition:0.2s; height:28px; }
        .member-item .actions .btn-set-admin { background:var(--primary); color:#fff; }
        .member-item .actions .btn-set-member { background:rgba(255,255,255,0.1); color:var(--text); }
        .member-item .actions .btn-remove { background:#e74c3c; color:#fff; }

        .empty-state { text-align:center; padding:60px 20px; color:rgba(255,255,255,0.3); }
        .empty-state .icon { font-size:48px; margin-bottom:var(--space-md); }

        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        @media(max-width:768px) {
            .sidebar { width:100%; min-width:unset; }
            .chat-area { display:none; width:100%; }
            .chat-area.open { display:flex; }
            .chat-header .back { display:block; }
            .sidebar-header .title { font-size:16px; }
            .session-item .avatar { width:36px; height:36px; font-size:12px; }
        }
    </style>
</head>
<body>

<div class="wechat-layout">

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="title">💬 APE 聊天</div>
            <div class="actions">
                <button onclick="openThemeModal()">🎨 主题</button>
                <button onclick="openCreateRoomModal()">➕ 建群</button>
                <button onclick="goHome()" style="color:#e74c3c;border-color:#e74c3c;">退出</button>
            </div>
        </div>
        <div class="session-search">
            <input id="search-input" placeholder="搜索联系人、群聊..." onkeyup="searchSessions()">
        </div>
        <div class="session-list" id="session-list">
            <div class="empty-state"><div class="icon">📭</div>暂无聊天</div>
        </div>
    </div>

    <div class="chat-area" id="chat-area">
        <div class="chat-header">
            <button class="back" onclick="closeChat()">‹ 返回</button>
            <div class="room-name" id="current-room-name">
                选择一个聊天
                <span class="online-status" id="online-status"></span>
            </div>
            <div class="right-actions">
                <button onclick="togglePin()" id="pin-btn">📌 置顶</button>
                <button onclick="openMemberModal()">👥 成员</button>
                <button onclick="openRoomSettings()">⚙️</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state" style="padding:40px 20px;">
                <div class="icon">💬</div>
                选择聊天开始对话
            </div>
        </div>
        <div class="chat-input-area">
            <input id="msg-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

</div>

<!-- ===== 用户中心弹窗 ===== -->
<div class="modal-overlay" id="profile-modal" onclick="if(event.target===this) closeProfileModal()">
    <div class="modal">
        <h3>👤 个人资料</h3>
        <div style="text-align:center;margin-bottom:var(--space-md);">
            <div style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;margin:0 auto var(--space-sm);" id="profile-avatar"></div>
            <div style="font-size:20px;font-weight:600;" id="profile-name">未登录</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.4);" id="profile-role">普通用户</div>
        </div>
        <div style="text-align:center;font-size:13px;color:rgba(255,255,255,0.3);">
            <div>📝 帖子: <span id="profile-posts">0</span></div>
            <div>👍 获赞: <span id="profile-likes">0</span></div>
        </div>
        <div class="btn-row" style="margin-top:var(--space-md);">
            <button class="btn-remove" style="background:#e74c3c;color:#fff;border:none;padding:8px20px;border-radius:12px;cursor:pointer;font-size:14px;" onclick="logoutUser()">退出登录</button>
            <button class="cancel" onclick="closeProfileModal()">关闭</button>
        </div>
        <!-- 隐藏的文件上传控件用于更换头像 -->
        <input type="file" id="avatar-upload-input" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
    </div>
</div>

<div class="modal-overlay" id="theme-modal" onclick="if(event.target===this) closeThemeModal()">
    <div class="modal">
        <h3>🎨 主题设置</h3>
        <div style="margin-bottom:var(--space-sm);">
            <div style="font-size:13px;color:rgba(255,255,255,0.4);">主色</div>
            <div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;">
                <button onclick="setColor('#444')" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#444;cursor:pointer;"></button>
                <button onclick="setColor('#d32f2f')" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#d32f2f;cursor:pointer;"></button>
                <button onclick="setColor('#2e7d32')" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#2e7d32;cursor:pointer;"></button>
                <button onclick="setColor('#1565c0')" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#1565c0;cursor:pointer;"></button>
                <button onclick="setColor('#e65100')" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#e65100;cursor:pointer;"></button>
            </div>
        </div>
        <div style="margin-bottom:var(--space-sm);">
            <div style="font-size:13px;color:rgba(255,255,255,0.4);">模式</div>
            <div style="display:flex;gap:var(--space-sm);">
                <button class="confirm" onclick="setTheme('dark')">🌙 深色</button>
                <button class="confirm" onclick="setTheme('light')">☀️ 浅色</button>
            </div>
        </div>
        <div class="btn-row">
            <button class="cancel" onclick="closeThemeModal()">关闭</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="create-room-modal" onclick="if(event.target===this) closeCreateRoomModal()">
    <div class="modal">
        <h3>📁 新建群聊</h3>
        <input id="new-room-name" placeholder="输入群聊名称...">
        <div class="btn-row">
            <button class="cancel" onclick="closeCreateRoomModal()">取消</button>
            <button class="confirm" onclick="createRoom()">创建</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="member-modal" onclick="if(event.target===this) closeMemberModal()">
    <div class="modal">
        <h3>👥 群成员 <span id="member-count" style="font-size:14px;color:rgba(255,255,255,0.4);"></span></h3>
        <div id="member-list"></div>
        <div class="btn-row" style="margin-top:var(--space-md);">
            <button class="cancel" onclick="closeMemberModal()">关闭</button>
        </div>
    </div>
</div>

<!-- ===== 群设置弹窗（含解散群聊） ===== -->
<div class="modal-overlay" id="room-settings-modal" onclick="if(event.target===this) closeRoomSettings()">
    <div class="modal">
        <h3>⚙️ 群设置</h3>
        <div style="margin-bottom:var(--space-sm);">
            <div style="font-size:13px;color:rgba(255,255,255,0.4);">群号</div>
            <div style="font-size:16px;font-weight:500;" id="room-code">---</div>
        </div>
        <div style="margin-bottom:var(--space-sm);">
            <div style="font-size:13px;color:rgba(255,255,255,0.4);">群公告</div>
            <textarea id="room-announcement" placeholder="暂无公告" rows="3" onchange="updateAnnouncement()"></textarea>
        </div>
        <div style="margin-bottom:var(--space-sm);">
            <label style="display:flex;align-items:center;gap:var(--space-sm);font-size:14px;cursor:pointer;">
                <input type="checkbox" id="room-dnd" onchange="toggleDND()"> 免打扰
            </label>
        </div>
        <div class="btn-row" style="flex-direction:column;gap:var(--space-sm);">
            <button class="cancel" onclick="closeRoomSettings()">关闭</button>
            <button class="btn-remove" style="background:#e74c3c;color:#fff;border:none;padding:8px20px;border-radius:12px;cursor:pointer;font-size:14px;" onclick="deleteSession()">删除我的会话</button>
            <button id="destroy-room-btn" style="display:none;background:#b71c1c;color:#fff;border:none;padding:8px20px;border-radius:12px;cursor:pointer;font-size:14px;" onclick="destroyRoom()">💥 解散群聊（仅群主/超级管理员）</button>
        </div>
    </div>
</div>

<!-- ===== 登录弹窗（若未登录则提示，与论坛共享账号） ===== -->
<div class="modal-overlay" id="auth-overlay" onclick="if(event.target===this) closeAuth()">
    <div class="modal" style="max-width:400px;">
        <span class="close" onclick="closeAuth()">✕</span>
        <h3 id="auth-title" style="color:var(--primary);font-size:20px;margin-bottom:15px;">登录 APE</h3>
        <div class="form-group">
            <input id="auth-username" placeholder="用户名" style="width:100%;">
        </div>
        <div class="form-group">
            <input id="auth-password" type="password" placeholder="密码" style="width:100%;">
        </div>
        <button class="btn" onclick="handleAuth()" id="auth-btn" style="width:100%;padding:10px;">登录</button>
        <div style="text-align:center;margin-top:10px;font-size:13px;color:#888;cursor:pointer;" onclick="toggleAuthMode()">
            <span id="auth-switch">没有账号？ <span style="color:var(--primary);">去注册</span></span>
        </div>
    </div>
</div>

<script>
    // ===== 配置 =====
    const SB = supabase.createClient(
        'https://bmykwusmtkbowpfbeozn.supabase.co',
        'sb_publishable_t-YpxPIgGInkdHxBFPVgGQ_1YQNbD0Z'
    );

    const state = {
        user: localStorage.getItem('ape_user') || null,
        avatar: localStorage.getItem('ape_avatar') || null,
        role: localStorage.getItem('ape_role') || 'user',
        currentRoomId: null,
        sessions: [],
        messages: [],
        pinned: JSON.parse(localStorage.getItem('ape_pinned') || '[]'),
        dnd: JSON.parse(localStorage.getItem('ape_dnd') || '{}'),
        unread: JSON.parse(localStorage.getItem('ape_unread') || '{}'),
        themeColor: localStorage.getItem('ape_theme_color') || '#444',
        lightMode: localStorage.getItem('ape_light_mode') === 'true',
        messageSubscription: null
    };

    const $ = id => document.getElementById(id);

    // ===== Toast 通知 =====
    function showToast(msg, type = 'info') {
        const colors = { info: '#444', success: '#4caf50', error: '#e74c3c' };
        const div = document.createElement('div');
        div.style.cssText = `
            position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
            background:${colors[type] || '#444'}; color:#fff;
            padding:10px 24px; border-radius:12px; font-size:14px;
            z-index:99999; backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
            animation:fadeIn 0.3s ease-out;
        `;
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }

    // ===== 登录拦截 =====
    if (!state.user) {
        showToast('请先登录！', 'error');
        window.location.href = '/chat.html';
    }

    // ===== 主题系统 =====
    function applyTheme() {
        if (state.lightMode) document.body.classList.add('light-mode');
        else document.body.classList.remove('light-mode');
        document.documentElement.style.setProperty('--primary', state.themeColor);
        document.documentElement.style.setProperty('--hover', state.themeColor + 'cc');
        document.documentElement.style.setProperty('--shadow', state.themeColor + '66');
    }

    function setColor(color) {
        state.themeColor = color;
        localStorage.setItem('ape_theme_color', color);
        applyTheme();
        showToast('主题色已更新');
    }

    function setTheme(mode) {
        state.lightMode = mode === 'light';
        localStorage.setItem('ape_light_mode', state.lightMode ? 'true' : 'false');
        applyTheme();
        showToast(mode === 'light' ? '已切换浅色模式' : '已切换深色模式');
    }

    function openThemeModal() { $('theme-modal').classList.add('active'); }
    function closeThemeModal() { $('theme-modal').classList.remove('active'); }
    applyTheme();

    // ===== 用户信息与资料 =====
    async function refreshUserProfile() {
        if (!state.user) return;
        try {
            const { data, error } = await SB.from('users').select('role, avatar_url').eq('username', state.user).single();
            if (data && !error) {
                state.role = data.role || 'user';
                state.avatar = data.avatar_url || null;
                localStorage.setItem('ape_role', state.role);
                if (state.avatar) localStorage.setItem('ape_avatar', state.avatar);
            }
        } catch (e) {
            console.error('加载用户信息失败:', e);
        }
    }

    function goHome() { window.location.href = '/chat.html'; }

    function generateRoomCode() {
        const now = new Date();
        const y = String(now.getFullYear()).slice(2);
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        return y + m + d + h + min;
    }

    // ===== 用户中心（含头像上传） =====
    function openProfileModal() {
        $('profile-modal').classList.add('active');
        const avatarEl = $('profile-avatar');
        if (state.avatar && state.avatar.trim() !== '') {
            avatarEl.style.background = 'transparent';
            avatarEl.innerHTML = `<img src="${state.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;cursor:pointer;" onclick="document.getElementById('avatar-upload-input').click()">`;
        } else {
            avatarEl.style.background = 'var(--primary)';
            avatarEl.textContent = state.user.charAt(0).toUpperCase();
            avatarEl.style.cursor = 'pointer';
            avatarEl.onclick = () => document.getElementById('avatar-upload-input').click();
        }
        $('profile-name').textContent = state.user;
        const roleLabel = state.role === 'super_admin' ? '🌟 超级管理员' : (state.role === 'admin' ? '🛡️ 管理员' : '👤 普通用户');
        $('profile-role').textContent = roleLabel;
        loadUserStats(state.user);
    }

    function closeProfileModal() { $('profile-modal').classList.remove('active'); }

    async function handleAvatarUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            showToast('图片不能超过2MB', 'error');
            return;
        }
        const fileName = `${Date.now()}_${file.name}`;
        const { error: uploadError } = await SB.storage.from('avatars').upload(fileName, file);
        if (uploadError) {
            showToast('上传失败: ' + uploadError.message, 'error');
            return;
        }
        const { data: urlData } = SB.storage.from('avatars').getPublicUrl(fileName);
        const newAvatarUrl = urlData.publicUrl;

        const { error: updateError } = await SB.from('users')
            .update({ avatar_url: newAvatarUrl })
            .eq('username', state.user);
        if (updateError) {
            showToast('更新头像失败', 'error');
            return;
        }

        state.avatar = newAvatarUrl;
        localStorage.setItem('ape_avatar', newAvatarUrl);
        showToast('✅ 头像已更新', 'success');
        openProfileModal();
    }

    function logoutUser() {
        if (!confirm('确认退出登录吗？')) return;
        state.user = null;
        state.role = 'user';
        localStorage.removeItem('ape_user');
        localStorage.removeItem('ape_role');
        closeProfileModal();
        window.location.href = '/chat.html';
        showToast('已退出登录');
    }

    async function loadUserStats(username) {
        const { count: postCount } = await SB.from('posts').select('id', { count: 'exact', head: true }).eq('username', username);
        const { data: likesData } = await SB.from('likes').select('id').eq('username', username);
        $('profile-posts').textContent = postCount || 0;
        $('profile-likes').textContent = likesData ? likesData.length : 0;
    }

    // ===== 会话列表 =====
    async function loadSessions() {
        const list = $('session-list');
        const { data: roomData } = await SB
            .from('room_members')
            .select('room_id, rooms(id, name, creator_username, announcement, code)')
            .eq('username', state.user);

        let sessions = [];
        if (roomData) {
            roomData.forEach(r => {
                sessions.push({
                    id: r.room_id,
                    type: 'room',
                    name: r.rooms.name,
                    avatar: r.rooms.name.charAt(0),
                    lastTime: r.rooms.created_at,
                    lastMsg: '点击进入聊天',
                    creator: r.rooms.creator_username,
                    announcement: r.rooms.announcement,
                    code: r.rooms.code
                });
            });
        }

        // APE审核群（只创建一次，用标志防止死循环）
        const apeCreated = localStorage.getItem('ape_created') === 'true';
        if (!apeCreated) {
            const { data: existing } = await SB.from('rooms').select('id').eq('name', 'APE审核群');
            if (!existing || existing.length === 0) {
                const code = generateRoomCode();
                await SB.from('rooms').insert({
                    name: 'APE审核群',
                    creator_username: '系统',
                    code: code
                });
                localStorage.setItem('ape_created', 'true');
            }
            loadSessions();
            return;
        }

        sessions.sort((a, b) => {
            const aPinned = state.pinned.includes(a.id);
            const bPinned = state.pinned.includes(b.id);
            if (aPinned && !bPinned) return -1;
            if (!aPinned && bPinned) return 1;
            return new Date(b.lastTime) - new Date(a.lastTime);
        });

        state.sessions = sessions;
        if (sessions.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="icon">📭</div>暂无聊天</div>';
            return;
        }

        list.innerHTML = sessions.map(s => {
            const isPinned = state.pinned.includes(s.id);
            const isDND = state.dnd[s.id] || false;
            const unreadCount = state.unread[s.id] || 0;
            const isActive = s.id === state.currentRoomId;
            return `
                <div class="session-item ${isActive ? 'active' : ''}" onclick="openSession('${s.id}')" data-id="${s.id}">
                    <div class="avatar">${s.avatar}
                        <div class="online-dot online"></div>
                    </div>
                    <div class="info">
                        <div class="name">
                            ${s.name}
                            ${isPinned ? '<span class="pin-icon">📌</span>' : ''}
                            ${isDND ? '<span style="font-size:12px;">🔕</span>' : ''}
                            ${s.code ? `<span style="font-size:11px;color:rgba(255,255,255,0.3);margin-left:4px;">#${s.code}</span>` : ''}
                        </div>
                        <div class="last-msg ${unreadCount > 0 ? 'unread' : ''}">${s.lastMsg}</div>
                    </div>
                    <div class="time">${formatTime(s.lastTime)}</div>
                    ${unreadCount > 0 ? `<div class="unread-badge">${unreadCount}</div>` : ''}
                </div>
            `;
        }).join('');
    }

    function formatTime(dateStr) {
        const d = new Date(dateStr);
        const now = new Date();
        const diff = (now - d) / (1000 * 60 * 60);
        if (diff < 24) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
    }

    function searchSessions() {
        const q = $('search-input').value.toLowerCase();
        document.querySelectorAll('.session-item').forEach(el => {
            const name = el.querySelector('.name')?.textContent?.toLowerCase() || '';
            el.style.display = name.includes(q) ? 'flex' : 'none';
        });
    }

    // ===== 打开聊天 =====
    async function openSession(id) {
        state.currentRoomId = id;
        $('chat-area').classList.add('open');

        const session = state.sessions.find(s => s.id === id);
        if (!session) return;

        if (state.unread[id]) {
            delete state.unread[id];
            localStorage.setItem('ape_unread', JSON.stringify(state.unread));
        }

        $('current-room-name').innerHTML = `${session.name} <span class="online-status">群聊</span>`;
        $('pin-btn').textContent = state.pinned.includes(id) ? '📌 已置顶' : '📌 置顶';

        document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
        const target = document.querySelector(`.session-item[data-id="${id}"]`);
        if (target) target.classList.add('active');

        subscribeToMessages(id);
        await loadMessages(id);
        loadSessions();
        setTimeout(() => $('msg-input').focus(), 300);
    }

    function closeChat() {
        $('chat-area').classList.remove('open');
        document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
        if (state.messageSubscription) {
            SB.removeChannel(state.messageSubscription);
            state.messageSubscription = null;
        }
    }

    // ===== 实时消息订阅 =====
    function subscribeToMessages(roomId) {
        if (state.messageSubscription) {
            SB.removeChannel(state.messageSubscription);
            state.messageSubscription = null;
        }

        state.messageSubscription = SB
            .channel('messages-channel-' + roomId)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `room_id=eq.${roomId}`
            }, payload => {
                if (state.currentRoomId === roomId) {
                    loadMessages(roomId);
                    const container = $('chat-messages');
                    container.scrollTop = container.scrollHeight;
                }
                loadSessions();
            })
            .subscribe();
    }

    // ===== 消息系统 =====
    async function loadMessages(roomId) {
        const container = $('chat-messages');
        const { data, error } = await SB
            .from('messages')
            .select('*')
            .eq('room_id', roomId)
            .order('created_at', { ascending: true });

        if (error) {
            console.error('加载消息失败:', error);
            showToast('加载消息失败', 'error');
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:40px 20px;"><div class="icon">💬</div>暂无消息</div>';
            return;
        }

        state.messages = data;
        let lastDate = '';
        container.innerHTML = data.map(msg => {
            const isSelf = msg.username === state.user;
            const msgDate = new Date(msg.created_at).toLocaleDateString();
            let dateDiv = '';
            if (msgDate !== lastDate) {
                dateDiv = `<div class="system-msg">${msgDate}</div>`;
                lastDate = msgDate;
            }

            let content = msg.content;
            const tempDiv = document.createElement('div');
            tempDiv.textContent = content;
            content = tempDiv.innerHTML;
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            content = content.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');

            if (msg.is_system) {
                return `<div class="system-msg">${content}</div>`;
            }

            return `
                ${dateDiv}
                <div class="msg-row ${isSelf ? 'self' : ''}">
                    <div class="avatar">${msg.username.charAt(0)}</div>
                    <div class="msg-bubble">${content}</div>
                </div>
            `;
        }).join('');
        container.scrollTop = container.scrollHeight;
    }

    // ===== 发消息 =====
    let isSending = false;
    async function sendMessage() {
        if (!state.user) { showToast('请先登录', 'error'); return; }
        if (!state.currentRoomId) { showToast('请先选择一个聊天', 'error'); return; }
        if (isSending) return;
        const input = $('msg-input');
        const content = input.value.trim();
        if (!content) return;

        isSending = true;
        const btn = document.querySelector('.chat-input-area button');
        const origText = btn.textContent;
        btn.textContent = '发送中...';
        btn.disabled = true;

        try {
            const { error } = await SB.from('messages').insert({
                room_id: state.currentRoomId,
                username: state.user,
                content: content,
                is_system: false
            });
            if (error) {
                showToast('发送失败: ' + error.message, 'error');
                return;
            }
            input.value = '';
            await loadMessages(state.currentRoomId);
            loadSessions();
            const container = $('chat-messages');
            container.scrollTop = container.scrollHeight;
            setTimeout(() => input.focus(), 100);
        } catch (e) {
            console.error(e);
            showToast('发送异常，请重试', 'error');
        } finally {
            btn.textContent = origText;
            btn.disabled = false;
            isSending = false;
        }
    }

    // ===== 置顶 =====
    function togglePin() {
        const id = state.currentRoomId;
        if (!id) return;
        const idx = state.pinned.indexOf(id);
        if (idx > -1) state.pinned.splice(idx, 1);
        else state.pinned.push(id);
        localStorage.setItem('ape_pinned', JSON.stringify(state.pinned));
        $('pin-btn').textContent = state.pinned.includes(id) ? '📌 已置顶' : '📌 置顶';
        loadSessions();
    }

    // ===== 免打扰 =====
    function toggleDND() {
        const id = state.currentRoomId;
        if (!id) return;
        state.dnd[id] = $('room-dnd').checked;
        localStorage.setItem('ape_dnd', JSON.stringify(state.dnd));
    }

    // ===== 删除会话 =====
    function deleteSession() {
        if (!confirm('确认删除该会话？聊天记录和成员记录将被清除。')) return;
        const id = state.currentRoomId;
        if (!id) return;
        SB.from('messages').delete().eq('room_id', id);
        SB.from('room_members').delete().eq('room_id', id);
        closeChat();
        loadSessions();
        closeRoomSettings();
        showToast('会话已删除');
    }

    // ===== 解散群聊（仅群主/超级管理员） =====
    async function destroyRoom() {
        if (!confirm('⚠️ 确认解散这个群聊吗？所有成员、消息将全部删除，不可恢复！')) return;
        const id = state.currentRoomId;
        if (!id) return;
        const { error } = await SB.from('rooms').delete().eq('id', id);
        if (error) {
            showToast('解散失败: ' + error.message, 'error');
            return;
        }
        closeChat();
        loadSessions();
        closeRoomSettings();
        showToast('群聊已解散', 'success');
    }

    // ===== 创建群聊 =====
    function openCreateRoomModal() {
        if (!state.user) { showToast('请先登录', 'error'); return; }
        $('create-room-modal').classList.add('active');
        $('new-room-name').value = '';
    }
    function closeCreateRoomModal() { $('create-room-modal').classList.remove('active'); }

    async function createRoom() {
        const name = $('new-room-name').value.trim();
        if (!name) { showToast('请输入群聊名称', 'error'); return; }

        const code = generateRoomCode();
        const { data: room, error: roomErr } = await SB.from('rooms').insert({
            name: name,
            creator_username: state.user,
            code: code
        }).select().single();

        if (roomErr) { showToast('创建失败: ' + roomErr.message, 'error'); return; }

        await SB.from('room_members').insert({
            room_id: room.id,
            username: state.user,
            role: 'admin'
        });

        await SB.from('messages').insert({
            room_id: room.id,
            username: '系统',
            content: `群聊 "${name}" 已创建，群号: ${code}`,
            is_system: true
        });

        closeCreateRoomModal();
        await loadSessions();
        openSession(room.id);
        showToast('群聊创建成功！', 'success');
    }

    // ===== 成员管理 =====
    function openMemberModal() {
        if (!state.currentRoomId) { showToast('请先选择一个群聊', 'error'); return; }
        $('member-modal').classList.add('active');
        loadMembers(state.currentRoomId);
    }
    function closeMemberModal() { $('member-modal').classList.remove('active'); }

    async function loadMembers(roomId) {
        const list = $('member-list');
        const { data, error } = await SB.from('room_members').select('username, role').eq('room_id', roomId);
        if (error) { console.error(error); return; }
        if (!data || data.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);">暂无成员</div>';
            return;
        }

        const { data: roomData } = await SB.from('rooms').select('creator_username').eq('id', roomId).single();
        const creator = roomData?.creator_username || '';
        $('member-count').textContent = `(${data.length}人)`;

        const { data: myRoleData } = await SB.from('room_members')
            .select('role')
            .eq('room_id', roomId)
            .eq('username', state.user)
            .single();
        const myRole = myRoleData?.role || 'member';

        const isSuperAdmin = state.role === 'super_admin';
        const canManage = isSuperAdmin || (state.user === creator) || (myRole === 'admin');

        list.innerHTML = data.map(m => {
            const isCreator = m.username === creator;
            const isSelf = m.username === state.user;
            const roleLabel = isCreator ? '👑 群主' : (m.role === 'admin' ? '🛡️ 管理员' : '👤 成员');
            const roleClass = isCreator ? 'owner' : (m.role === 'admin' ? 'admin' : '');

            let actionsHtml = '';
            if (canManage && !isSelf && !isCreator) {
                if (m.role === 'admin') {
                    actionsHtml = `
                        <button class="btn-set-member" onclick="setMemberRole('${roomId}', '${m.username}', 'member')">撤销管理</button>
                        <button class="btn-remove" onclick="removeMember('${roomId}', '${m.username}')">移出</button>
                    `;
                } else {
                    actionsHtml = `
                        <button class="btn-set-admin" onclick="setMemberRole('${roomId}', '${m.username}', 'admin')">设为管理</button>
                        <button class="btn-remove" onclick="removeMember('${roomId}', '${m.username}')">移出</button>
                    `;
                }
            }

            return `
                <div class="member-item">
                    <div class="name">
                        <span class="online-dot-sm online"></span>
                        ${m.username} ${isSelf ? '(我)' : ''}
                        <span class="role-badge ${roleClass}">${roleLabel}</span>
                    </div>
                    <div class="actions">${actionsHtml}</div>
                </div>
            `;
        }).join('');
    }

    async function setMemberRole(roomId, username, role) {
        if (!confirm(`确认将 ${username} 设为 ${role === 'admin' ? '管理员' : '普通成员'} 吗？`)) return;
        const { error } = await SB.from('room_members').update({ role }).eq('room_id', roomId).eq('username', username);
        if (error) { showToast('操作失败: ' + error.message, 'error'); return; }
        loadMembers(roomId);
        showToast('角色已更新', 'success');
    }

    async function removeMember(roomId, username) {
        if (!confirm(`确认将 ${username} 移出群聊吗？`)) return;
        const { error } = await SB.from('room_members').delete().eq('room_id', roomId).eq('username', username);
        if (error) { showToast('操作失败: ' + error.message, 'error'); return; }
        loadMembers(roomId);
        showToast('已移出群聊', 'success');
    }

    // ===== 群设置 =====
    async function openRoomSettings() {
        if (!state.currentRoomId) { showToast('请先选择一个群聊', 'error'); return; }
        $('room-settings-modal').classList.add('active');
        const { data: room } = await SB.from('rooms').select('code, announcement, creator_username').eq('id', state.currentRoomId).single();
        if (room) {
            $('room-code').textContent = room.code || generateRoomCode();
            $('room-announcement').value = room.announcement || '';
            const isOwner = state.user === room.creator_username;
            const isSuperAdmin = state.role === 'super_admin';
            if (isOwner || isSuperAdmin) {
                document.getElementById('destroy-room-btn').style.display = 'inline-block';
            } else {
                document.getElementById('destroy-room-btn').style.display = 'none';
            }
        }
        $('room-dnd').checked = state.dnd[state.currentRoomId] || false;
    }

    function closeRoomSettings() { $('room-settings-modal').classList.remove('active'); }

    async function updateAnnouncement() {
        const text = $('room-announcement').value.trim();
        await SB.from('rooms').update({ announcement: text }).eq('id', state.currentRoomId);
        if (text) {
            await SB.from('messages').insert({
                room_id: state.currentRoomId,
                username: '系统',
                content: `📢 群公告: ${text}`,
                is_system: true
            });
            await loadMessages(state.currentRoomId);
            showToast('公告已发布', 'success');
        }
    }

    // ===== 初始化 =====
    refreshUserProfile();
    loadSessions();
</script>
</body>
</html>
